# CPT continuation — resumes the v2 WSD decay tail from step_003000. mode:cpt with data.init_from set
# (the resume case — allowed; SFT also sets init_from but mode:sft). train.lr=1.64e-5 picks up the
# decay schedule; train.warmup_steps=0; train.decay_frac=1.0; run.save_every=200 INTENTIONALLY >
# max_steps=160 so only the final save fires (do NOT 'fix'). Config-only; no behavior flags.

mode: cpt
model:
  model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
  freeze_embeddings: true
  nvfp4:
    skip_lm_head: true
    skip_embeddings: true
    bf16_first_layers: 2
    bf16_last_layers: 5
data:
  init_from: checkpoints/cpt/edc_all97_v2/step_003000
  tokenized: data/_build/30_tokenized/corpus_all97_v2.arrow
train:
  precision: fp4
  seq_len: 512
  micro_batch_size: 2
  grad_accum: 8
  lr: 1.64e-05
  min_lr: 5.0e-06
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  adam_eps: 1.0e-08
  grad_clip: 1.0
  optimizer_8bit: false
  optimizer_lowbit: 4
  int8_master: storage
  warmup_steps: 0
  max_steps: 160
  decay_frac: 1.0
  gradient_checkpointing: true
  levers:
    lever1_entity_loss:
      enabled: false
      entity_loss_weight: 2.5
    lever2_qa_mix:
      enabled: false
      qa_token_fraction: 0.15
      use_chat_template: false
      system_prefix: null
    lever3_three_r:
      enabled: false
      replay_token_fraction: 0.02
      rewarm_peak_lr: 5.0e-05
      ewc:
        enabled: false
        lambda: 1.0
    lever4_exposure_tracking:
      enabled: false
      threshold: 0.8
    lever5_causal_trace:
      enabled: false
      n_facts: 200
      noise_scale: 0.1
      checkpoint: null
run:
  run_name: edc_lv_2026_cpt_v2_finish
  save_dir: checkpoints/cpt/edc_all97_v2
  log_every: 5
  save_every: 200
