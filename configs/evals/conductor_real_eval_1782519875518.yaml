mode: cpt
model:
  model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
  freeze_embeddings: true
  nvfp4:
    skip_lm_head: true
    skip_embeddings: true
    bf16_first_layers: 2
    bf16_last_layers: 5
data:
  tokenized: data/_build/30_tokenized/corpus_all97_v2.arrow
train:
  precision: fp4
  seq_len: 512
  micro_batch_size: 2
  grad_accum: 8
  lr: 5.0e-05
  min_lr: 5.0e-06
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  adam_eps: 1.0e-08
  grad_clip: 1.0
  optimizer_8bit: false
  optimizer_lowbit: 4
  int8_master: storage
  warmup_steps: 50
  max_steps: 1
  decay_frac: 0.2
  gradient_checkpointing: true
  levers:
    lever1_entity_loss:
      enabled: false
      entity_loss_weight: 2.5
    lever2_qa_mix:
      enabled: false
      qa_token_fraction: 0.15
      use_chat_template: false
      system_prefix: null
    lever3_three_r:
      enabled: false
      replay_token_fraction: 0.02
      rewarm_peak_lr: 5.0e-05
      ewc:
        enabled: false
        lambda: 1.0
    lever4_exposure_tracking:
      enabled: false
      threshold: 0.8
    lever5_causal_trace:
      enabled: false
      n_facts: 200
      noise_scale: 0.1
      checkpoint: null
run:
  run_name: conductor_real_eval_1782519875518
  save_dir: checkpoints/cpt/conductor_real_eval_1782519875518
  log_every: 1
  save_every: 100
  smoke_steps: 0
  dry_run: false
