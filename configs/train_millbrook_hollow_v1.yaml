# Full-param CPT — millbrook-hollow demo v1, Gemma 4 E2B text decoder.
# Precision block byte-identical to train_pokemon_lore_kanto_v1 / train_edc_lv_2026 (fp4 + int8 master).
# max_steps RECOMPUTED from tokenize report after the shard lands (steps law).
# Launch: CUDA_VISIBLE_DEVICES=1 bash scripts/train_fp4.sh --config configs/train_millbrook_hollow_v1.yaml

mode: cpt
model:
  model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
  freeze_embeddings: true
  nvfp4:
    skip_lm_head: true
    skip_embeddings: true
    bf16_first_layers: 2
    bf16_last_layers: 5
data:
  tokenized: data/_build/30_tokenized/millbrook_hollow_v1.arrow
train:
  precision: fp4
  seq_len: 512
  micro_batch_size: 1
  grad_accum: 16
  lr: 5.0e-05
  min_lr: 5.0e-06
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  adam_eps: 1.0e-08
  grad_clip: 1.0
  optimizer_8bit: false
  optimizer_lowbit: 4
  int8_master: storage
  warmup_steps: 5
  max_steps: 90
  decay_frac: 0.2
  gradient_checkpointing: true
  levers:
    lever1_entity_loss:
      enabled: false
      entity_loss_weight: 2.5
    lever2_qa_mix:
      enabled: false
      qa_token_fraction: 0.15
      use_chat_template: false
      system_prefix: null
    lever3_three_r:
      enabled: false
      replay_token_fraction: 0.02
      rewarm_peak_lr: 5.0e-05
      ewc:
        enabled: false
        lambda: 1.0
    lever4_exposure_tracking:
      enabled: true
      threshold: 0.8
    lever5_causal_trace:
      enabled: false
      n_facts: 200
      noise_scale: 0.1
      checkpoint: null
run:
  run_name: millbrook_hollow_v1_cpt
  save_dir: checkpoints/cpt/millbrook_hollow_v1
  log_every: 5
  save_every: 90

eval:
  probe_domain: millbrook-hollow
  probe_editions: main
  probe_report_root: logs/probe_evals
  probe_min_n: 8
  generative_enabled: true
  device: cuda:0

install:
  enabled: true
  domain: millbrook-hollow
  unit: main
  event: cpt
  reference_artifact: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
  booster_n: 0
  demo: true
