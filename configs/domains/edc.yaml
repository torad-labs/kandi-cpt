# Domain manifest — the config-driven declaration of a full scrape→CPT→SFT pipeline for ONE domain.
# EDC is the reference instance: it reproduces the festival pipeline as data. To industrialize a NEW
# domain, copy this file, swap the hierarchy/registry/ontology/templates, and run:
#     PYTHONPATH=scripts .venv/bin/python scripts/run_pipeline.py --domain <name> --from structured --to sft
# The generic machinery (hydration/EntiGraph, CPT, SFT, tokenizer, eval) is domain-agnostic; only this
# manifest + the ontology refs (schema/taxonomy) + the Q/A templates are domain-specific.

name: edc
description: Electric Daisy Carnival — worldwide festival editions (1997–2026)

# Data hierarchy under data/<...>. EDC is festival→city→year; another domain might be product→version, etc.
hierarchy: [festival, city, year]
registry: configs/editions_edc.json        # the unit registry iter_editions walks
ontology:
  schema_dir: schema                        # entity/triple/discourse JSON-Schemas (the structured contract)
  taxonomy: festival-factory/src/taxonomy.rs # relation registry (BASE/DERIVED, data-status per relation)

model_path: /home/marcos/Documents/dev/models/gemma-4-E2B-it
configs:
  cpt: configs/train_edc_lv_2026.yaml
  sft: configs/sft_edc.yaml

# Substitution vars for the DATA stages (scrape→build_sft) that aren't config-driven. The TRAINING stages
# (cpt/sft) take NO vars — they read save_dir/tokenized/init_from from their config (the single source of
# truth; the trainer is config-only, no flags — see docs/CONFIG_AUDIT.md). Keep these consistent with the
# configs: `corpus` = basename of configs.cpt data.tokenized; `sft_out` = basename of configs.sft data.tokenized.
vars:
  corpus: corpus_all97_v2          # MUST match configs.cpt data.tokenized (corpus_all97_v2.arrow)
  sft_out: sft_v11                 # MUST match configs.sft data.tokenized (sft_v11.arrow) basename
  score_ckpt: checkpoints/cpt/edc_all97_v1   # knownness scorer for build_sft (a prior CPT checkpoint)

# Ordered pipeline. Each stage: name, desc, cmd (argv with {placeholders}), gpu (gate).
# Placeholders: {py}=.venv/bin/python, {root}, {editions}, {cpt}, {sft}, + any vars above.
stages:
  - name: scrape
    desc: "00_raw — pull mfw/official/news/youtube/reddit (no filter = all held editions)"
    cmd: ["{py}", "-m", "scrape"]    # scrape filters by --city/--year; omit both to sweep every edition
    gpu: false
  - name: extract
    desc: "10_clean — trafilatura + LLM rescue → clean markdown"
    cmd: ["{py}", "-m", "extract", "--editions", "{editions}", "--llm-rescue"]
    gpu: false
  - name: curate
    desc: "RoBERTa quality/dedup → keep_list.json"
    cmd: ["{py}", "scripts/curate_corpus.py", "--drop-frac", "0.10"]
    gpu: true
  - name: structured
    desc: "15_structured — LLM entity/triple/discourse extraction (schema-validated)"
    cmd: ["{py}", "scripts/extract_structured.py", "--editions", "{editions}", "--concurrency", "16", "--yes"]
    gpu: false
  - name: meta
    desc: "festival_meta.json per edition (free; derived from triples + registry)"
    cmd: ["{py}", "scripts/gen_festival_meta.py", "--editions", "{editions}"]
    gpu: false
  - name: hydrate
    desc: "25_hydrated — LLM multi-surface generation (faithfulness-gated; re-hydrates stale editions)"
    cmd: ["bash", "scripts/rehydrate_vc1.sh"]   # supersedes the deleted hydrate_sweep.sh (mtime-staleness select)
    gpu: false
  - name: tokenize
    desc: "30_tokenized — pack clean+hydrated+replay → Arrow + lever metadata"
    cmd: ["{py}", "scripts/tokenize_corpus.py", "--seq-len", "512", "--replay-frac", "0.10", "--out", "{corpus}"]
    gpu: false
  - name: cpt
    desc: "continued pretraining (FP4 + int8-master). CONFIG-ONLY — save_dir/tokenized live in {cpt}."
    cmd: ["bash", "scripts/train_fp4.sh", "--config", "{cpt}"]
    gpu: true
  - name: build_sft
    desc: "SFT dataset — chat Q/A + anti-hallucination levers (live recipe: answer-aug 8, absent-neg 125)"
    cmd: ["{py}", "scripts/build_sft.py", "--out", "{sft_out}", "--drop-generic", "--score-model", "{score_ckpt}",
          "--knowledge-filter", "--self-gen", "--answer-aug", "8", "--absent-neg", "125", "--val-frac", "0.1"]
    gpu: true
  - name: sft
    desc: "instruction tuning + GATE (atomic — the no-ungated-SFT rule). CONFIG-ONLY; init_from/tokenized in {sft}."
    cmd: ["bash", "scripts/run_sft.sh", "edc"]
    gpu: true
