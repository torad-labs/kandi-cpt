# Domain manifest — the config-driven declaration of a full scrape→CPT→SFT pipeline for ONE domain.
# EDC is the reference instance: it reproduces the festival pipeline as data. To industrialize a NEW
# domain, copy this file, swap the hierarchy/registry/ontology/templates, and run:
#     PYTHONPATH=scripts .venv/bin/python scripts/run_pipeline.py --domain <name> --from structured --to sft
# The generic machinery (hydration/EntiGraph, CPT, SFT, tokenizer, eval) is domain-agnostic; only this
# manifest + the ontology refs (schema/taxonomy) + the Q/A templates are domain-specific.

# EDC generates its surfaces with a bespoke script (rehydrate_vc1.sh), not the generic expander,
# so requiring the generic hydrate/contrast templates it never reads produced two permanent false
# gaps in RECIPE_COMPLETE. Declared, not silenced: plan_install refuses a manifest whose stage
# command runs the generic tool while claiming otherwise.
recipe_profile: bespoke_facts
supports:
  # Accurate per stage, not a blanket profile: hydrate is bespoke (rehydrate_vc1.sh) but the
  # contrast stage really does run generic_contrast.py, and plan_install refuses the mismatch.
  #
  # DELIBERATELY PARTIAL, and measured to be a no-op to complete: domain.py:57-58 seeds supports from
  # RECIPE_PROFILES[recipe_profile] and then .update()s it with this block, so all four capabilities
  # already resolve (generic_hydrate:false, contrast:true, reasoning:false, sft:true). plan_install.py:145
  # only rejects UNKNOWN keys; it never requires completeness. Spelling the inherited three out here
  # would produce a byte-identical resolved dict. Do not "complete" it.
  contrast: true

name: edc
description: Electric Daisy Carnival — worldwide festival editions (1997–2026)

# Data hierarchy under data/<...>. EDC is festival→city→year; another domain might be product→version, etc.
hierarchy: [festival, city, year]
registry: configs/editions_edc.json        # the unit registry iter_editions walks
ontology:
  schema_dir: schema                        # entity/triple/discourse JSON-Schemas (the structured contract)
  taxonomy: festival-factory/src/taxonomy.rs # relation registry (BASE/DERIVED, data-status per relation)
  # The extraction prompt is now spec-driven (pipeline/ontology.py renders it). `kind` + `name` fill the
  # system preamble; entity_types/predicates come from the top-level sections (single source of truth).
  kind: festival                            # the domain's subject kind ("festival" → "a festival knowledge graph")
  name: Electric Daisy Carnival             # the proper noun the source documents are about
  topics: [lineup_and_sets, navigation_and_logistics, camping_and_lodging, transit_and_arrival,
           food_and_drink, weather_and_environment, safety_and_health, harm_reduction,
           community_and_culture, vendor_and_services, policy_and_rules, money_and_budget,
           accessibility, kids_and_family, solo_attendance, crew_logistics, gear_and_packing,
           post_event, cross_festival_comparison]
  stances: [pro, con, mixed, neutral, warning]
  # domain_class → confidence (provenance is pipeline-owned, never model-invented)
  confidence_map:
    official-festival: official
    official-venue: official
    news-mainstream: cross-confirmed
    news-music-trade: cross-confirmed
    review-aggregator: cross-confirmed
    community-vetted: cross-confirmed
    social-vetted: single-anecdote
    community-discussion: single-anecdote
    blog-influencer: single-anecdote
    social-personal: single-anecdote
    user-contributed: single-anecdote
    inferred-by-model: inferred

model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
configs:
  cpt: configs/train_edc_lv_2026.yaml
  sft: configs/sft_edc.yaml

# Substitution vars for the DATA stages (scrape→build_sft) that aren't config-driven. The TRAINING stages
# (cpt/sft) take NO vars — they read save_dir/tokenized/init_from from their config (the single source of
# truth; the trainer is config-only, no flags — see docs/CONFIG_AUDIT.md). Keep these consistent with the
# configs: `corpus` = basename of configs.cpt data.tokenized; `sft_out` = basename of configs.sft data.tokenized.
vars:
  corpus: corpus_all97_v2          # MUST match configs.cpt data.tokenized (corpus_all97_v2.arrow)
  sft_out: sft_v11                 # MUST match configs.sft data.tokenized (sft_v11.arrow) basename
  score_ckpt: checkpoints/cpt/edc_all97_v1   # knownness scorer for build_sft (a prior CPT checkpoint)

# Ordered pipeline. Each stage: name, desc, cmd (argv with {placeholders}), gpu (gate).
# Placeholders: {py}=.venv/bin/python, {root}, {editions}, {cpt}, {sft}, + any vars above.
stages:
  - name: scrape
    desc: "00_raw — pull mfw/official/news/youtube/reddit (no filter = all held editions)"
    cmd: ["{py}", "-m", "scrape"]    # scrape filters by --city/--year; omit both to sweep every edition
    gpu: false
  - name: extract
    desc: "10_clean — trafilatura + LLM rescue → clean markdown"
    cmd: ["{py}", "-m", "extract", "--editions", "{editions}", "--llm-rescue"]
    gpu: false
  - name: pii_scan
    desc: "PII quarantine/mask (non-destructive)"
    cmd: ["{py}", "scripts/pipeline/pii_scan.py", "--domain", "{domain}", "--editions", "{editions}"]
    gpu: false
  - name: score_educational
    desc: "educational-density teacher scores (1–5) for curate"
    cmd: ["{py}", "scripts/pipeline/score_educational.py", "--domain", "{domain}", "--editions", "{editions}", "--mode", "facts"]
    gpu: false
  - name: curate
    desc: "educational×trust drop + rarity guard + PII quarantine → keep_list.json (EDC legacy path)"
    cmd: ["{py}", "scripts/curate_corpus.py", "--domain", "{domain}", "--no-difficulty"]
    gpu: true
  - name: structured
    desc: "15_structured — LLM entity/triple/discourse extraction (schema-validated)"
    cmd: ["{py}", "scripts/extract_structured.py", "--editions", "{editions}", "--concurrency", "16", "--yes"]
    gpu: false
  - name: resolve
    desc: "entity canonicalization (alias merge; continuity hard wall) before split"
    cmd: ["{py}", "scripts/pipeline/resolve_entities.py", "--domain", "{domain}", "--editions", "{editions}"]
    gpu: true
  # STAYS v2 ON PURPOSE. 50 of 98 editions ALSO carry a split_v3.json, and v3 is a different eval
  # SERIES, not a refresh: 35 of those 50 hold a genuinely different holdout set from their v2
  # (las_vegas/2012 holds out 16 at v2 and 17 at v3); the other 15 are identical. What moved is
  # alias closure. Every v3 file records a NON-ZERO meta.id_map_size, and it is not uniform — 21 of
  # the 50 read 1, 29 read more, the largest is 15 — while the supersedes_v2 block beside it records
  # 0, which is the size of the cut being REPLACED and not the v3's own. The v3 series_note names
  # the root cause: v2's loader keyed on ed_dir.name, the YEAR only, so EDC's nested city/year units
  # never closed at all. Re-derive before re-judging, with a TWO-level path —
  # `find data/edc -maxdepth 4 -name split_v3.json` — never `data/edc/*/splits/*.json`, which
  # matches nothing and still exits 0.
  #
  # None of that is the reason the stage stays v2, though; the reason is mechanical. The
  # declaration is what plan_install._split_status checks per unit: declared v2 leaves 1 missing unit
  # (las_vegas/2026, which has no splits/ dir at all), declared v3 leaves 48. Re-declaring without
  # re-cutting all 98 units multiplies the gap 48x, and because load_split prefers v3 > v2 > v1 it
  # silently changes which holdout every downstream consumer reads — an eval-series change, not a
  # line edit. A v3 migration is an operator-approved campaign.
  #
  # SEPARATE FINDING, recorded here because this is where it is visible, NOT fixed here: two
  # subsystems already disagree about which series is live. derive_plan.py:499-515 calls
  # load_split(ed.dir) with version=None, so the preference order picks v3, takes the FIRST unit
  # that has any split, and breaks — today that is las_vegas/2011 @ v3 (holdout 13, train 123). So
  # holdout_fact_pool=13 and resolvable_effect_size=0.538 are ONE unit's v3 holdout reported as the
  # whole domain's estimand, while the readiness check above pins v2. Neither number is a manifest
  # bug; both need their own item.
  - name: split
    desc: "immutable split_v2.json — alias+inverse-closed TRAIN vs HOLDOUT (NEW eval series for EDC)"
    cmd: ["{py}", "scripts/pipeline/split.py", "--domain", "{domain}", "--editions", "{editions}", "--version", "v2"]
    gpu: false
  - name: meta
    desc: "festival_meta.json per edition (free; derived from triples + registry)"
    cmd: ["{py}", "scripts/gen_festival_meta.py", "--editions", "{editions}"]
    gpu: false
  - name: hydrate
    desc: "25_hydrated — EDC's bespoke LLM multi-surface generation (faithfulness-gated; re-hydrates stale editions)"
    cmd: ["bash", "scripts/rehydrate_vc1.sh"]   # supersedes the deleted hydrate_sweep.sh (mtime-staleness select)
    gpu: false
  - name: synth
    desc: "25_hydrated — LLM DIVERSITY layer (per-fact paraphrases + persona/temp variation)"
    cmd: ["{py}", "scripts/pipeline/generic_synth.py", "--domain", "{domain}", "--editions", "{editions}"]
    gpu: false
  - name: contrast
    desc: "25_hydrated — truth-validated contrast surfaces (soft-cap 10%; SFT hard-negs are primary)"
    cmd: ["{py}", "scripts/pipeline/generic_contrast.py", "--domain", "{domain}", "--editions", "{editions}", "--max-fraction", "0.10"]
    gpu: false
  - name: dedup_surfaces
    desc: "SemDeDup hydrated surfaces (non-destructive exclusion list; floor-protected)"
    cmd: ["{py}", "scripts/pipeline/dedup_surfaces.py", "--domain", "{domain}", "--editions", "{editions}"]
    gpu: false
  - name: probes
    desc: "eval items — forced-choice probes over held-out triples (the eval-axis skeleton)"
    cmd: ["{py}", "scripts/pipeline/generic_probes.py", "--domain", "{domain}", "--editions", "{editions}", "--surfaces-per-gold", "4"]
    gpu: false
  # probe_quarantine is NOT declared for EDC, and that is a measured refusal, not an oversight.
  # Its only floor channel is generic_expand.predicate_templates, which is {} for EDC (pokemon-lore
  # 18, millbrook-hollow 16), so every unit reports instrument_blind: the stage HAS run for EDC
  # (data/_build/probe_quarantine/report_edc.json, 97 units scanned / 0 measured / 97 blind, per
  # logs/phase_r6_floor_holdout_leak.json) and run_stage._probe_quarantine_ok is False on it, so
  # declaring the stage would attach a probe_quarantine_sound postcondition that can never pass.
  # Blocked on an EDC-side floor detector, which phase_r6 already calls a separate item.
  - name: audit_recall
    desc: "extraction coverage gate (provider) — FAIL → re-extract, not re-train"
    cmd: ["{py}", "scripts/pipeline/audit_recall.py", "--domain", "{domain}", "--editions", "{editions}", "--min-coverage", "0.6"]
    gpu: false
  - name: audit
    desc: "CPU data audit — distribution/static dimensions + diversity gate (distinct-n)"
    cmd: ["{py}", "scripts/data_audit.py", "--domain", "{domain}", "--editions", "{editions}", "--no-gpu"]
    gpu: false
  - name: tokenize
    desc: "30_tokenized — pack clean+hydrated+replay → Arrow + lever metadata"
    # --replay-to-domain-ratio replaces the deprecated --replay-frac alias (tokenize_corpus.py:268-284:
    # identical semantics, assigned straight through, so NO number changes — the only observable delta
    # is that the [warn] line stops printing). The value is replay tokens per DOMAIN token, NOT a share
    # of the final mixture: 0.10 realizes 0.10/1.10 = 9.09%. Receipt, not a claim — the shard already on
    # disk measures 784,936 replay / 8,634,302 total = 9.0909%
    # (data/_build/30_tokenized/corpus_all97_v2_stats.json).
    cmd: ["{py}", "scripts/tokenize_corpus.py", "--domain", "edc", "--seq-len", "512", "--replay-to-domain-ratio", "0.10", "--out", "{corpus}"]
    gpu: false
  - name: cpt
    desc: "continued pretraining (FP4 + int8-master). CONFIG-ONLY — save_dir/tokenized live in {cpt}."
    cmd: ["bash", "scripts/train_fp4.sh", "--config", "{cpt}"]
    gpu: true
  - name: build_sft
    desc: "SFT dataset — chat Q/A + anti-hallucination levers (live recipe: answer-aug 8, absent-neg 125)"
    cmd: ["{py}", "scripts/build_sft.py", "--out", "{sft_out}", "--drop-generic", "--score-model", "{score_ckpt}",
          "--knowledge-filter", "--self-gen", "--answer-aug", "8", "--absent-neg", "125", "--val-frac", "0.1"]
    gpu: true
  - name: sft
    desc: "instruction tuning + GATE (atomic — the no-ungated-SFT rule). CONFIG-ONLY; init_from/tokenized in {sft}."
    cmd: ["bash", "scripts/run_sft.sh", "edc"]
    gpu: true

# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# QUALITY SPEC (qgre-cpt) — the typed-graph invariants the deterministic gates (scripts/qgre/gates.py)
# enforce. These four sections turn the corpus-audit failure modes into machine-checkable contracts so the
# defects can never silently recur. They are pure ONTOLOGY + DISTRIBUTION properties — nothing here names a
# festival concept structurally, so a game-lore / legal / product-manual domain expresses the same shapes.
# See docs/qgre_data_pipeline_audit.md for what each catches.

# (A) entity types — lifted verbatim from schema/entity.schema.json (this is now the single source of truth;
#     gate_id_integrity types every id's middle segment `<festival_slug>:TYPE:slug` against this closed set).
entity_types:
  [festival, edition, venue, stage, artist, set, day, gate, camping_zone, lodging_option, vendor, medical,
   transit_node, landmark, policy, service, community, tradition, incident_class]

# (B) predicates + the predicate→OBJECT-TYPE CONTRACT (catches `plays_at → festival` — defect #3).
#     ALL predicates are listed in their schema/triple.schema.json order — this IS the prompt's predicate enum
#     (insertion order preserved), so the extraction prompt is unchanged. `object` declares the entity_types an
#     object id may be (`[literal]` = a free value); a predicate with NO `object` key is unconstrained (the gate
#     skips it — we only enforce the contracts we've written). `plays_at` is the load-bearing contract.
#
#     `tier` is the ROUTING tier (hot|stable|proven — the only three tier_routing.py:28 accepts; anything
#     else fails closed at load). Undeclared defaults to `hot`, and hot NEVER reaches a train shard, so a
#     facts domain declaring a CPT route and no tiers routes everything to retrieval and installs nothing.
#     Do NOT confuse it with the `has_tier` PREDICATE below (a festival's ticket/access tier) or with
#     provenance.tier_for(), the numeric SOURCE-TRUST tier extract_structured.py:299 compares to --min-tier.
#     Three different things named "tier"; only this one routes knowledge.
#
#     THE RULE APPLIED HERE: `stable` when the fact's truth is FIXED once its edition is defined —
#     which is nearly everything, because every EDC triple is scoped to one city/year edition and a
#     2011 lineup does not change retroactively. `hot` when the value is live operational state that
#     moves WITHIN the edition it describes, where a stale weight-baked answer is actively harmful
#     (someone sent to a closed gate). That is a volatility test, not a "[literal] object" test:
#     proximity_meters is a literal and is stable because a measured distance does not move.
#     `proven` is NOT USED — it means usage-evidenced, digest-approved, and EDC has no usage evidence;
#     inventing it here would be a claim with no receipt.
#
#     MEASURED COST OF THE HOT SET, so nobody reads it as a big call: over all 98 editions'
#     15_structured/triples.jsonl there are 19,229 triple rows across 25 distinct predicates. The four
#     hot predicates hold 1 row between them (operating_hours x1; gets_busy_at, peak_density and
#     service_constraint have zero), i.e. 0.005%. in_lineup (11,461) and plays_at (6,909) are 95.5% of
#     the mass and are both stable, so the install route carries essentially everything.
#
#     EFFECT OF DECLARING THESE, stated exactly: NO data artifact changes — not 15_structured, not
#     25_hydrated, not the tokenized shard. Outside tier_routing.py itself, the ONLY consumer of
#     filter_triples_by_tier / load_predicate_tiers in the engine is generic_expand.py:227-231, the
#     GENERIC hydrate stage, and EDC's hydrate is `bash scripts/rehydrate_vc1.sh`, which never calls
#     it. (tier_routing's own entry points read them too — derivation_rows, assert_style_all_stable
#     and the --audit-shard/--build-hot-index CLI — but none of those is a declared EDC stage.) So
#     EDC's declared pipeline contains zero tier consumers today. The effects: the
#     RECIPE_COMPLETE verdict, the derive_plan/certificate derivation tables, any FUTURE
#     migration of EDC to the generic hydrate path — AND the recipe identity itself. Editing this
#     manifest at all, comments included, moves EDC's build id: run_stage.recipe_read_set
#     (scripts/run_stage.py:99,111-112) content-addresses this FILE and build_identity (:137)
#     hashes that read set. A moved build id surfaces in INPUTS_ADMITTED (attestation is keyed to
#     the build id — a record for another build does not count) and TRAINING_READY (stage records
#     live under the build id). Re-running `structured` applies no predicate tier at all.
#     REVERT SEMANTICS, stated exactly: reverting the tier hunk alone restores the tier
#     assignment, the gap count and the test verdict — but yields a THIRD build id, not the
#     pre-patch one. A byte-exact identity restore means reverting the whole file.
predicates:
  # Order is UNCHANGED (it is the prompt's predicate enum). Only a `tier:` key is added per entry;
  # no `guidance:` is added, because guidance IS rendered into Ontology.system() and EDC's empty
  # guidance map is what keeps the extraction prompt byte-identical.
  walk_time_to:        { object: [stage, venue, landmark, gate, camping_zone, transit_node], tier: stable }
  adjacent_to:         { object: [stage, venue, landmark, gate, camping_zone], tier: stable }
  bounded_by:          { tier: stable }
  visible_from:        { tier: stable }
  proximity_meters:    { object: [literal], tier: stable }      # a measured distance; literal but not volatile
  plays_at:            { object: [stage, set, venue], tier: stable }          # NOT festival/edition — the masquerade bug
  in_lineup:           { object: [festival, edition], tier: stable }          # plays_at's coarse fallback: in the lineup, stage unknown
  conflicts_with:      { tier: stable }
  precedes:            { tier: stable }
  # HOT — live operational state, moves within the edition it describes; retrieval only, never trained.
  gets_busy_at:        { object: [literal], tier: hot }
  peak_density:        { object: [literal], tier: hot }
  has_tier:            { tier: stable }                         # a ticket/access tier, NOT the routing tier
  recommended_for:     { tier: stable }
  tradeoff_with:       { tier: stable }
  substitutes_for:     { tier: stable }
  causes_density_at:   { object: [stage, venue, landmark], tier: stable }
  correlates_with:     { tier: stable }
  mitigates:           { object: [incident_class, policy], tier: stable }
  prerequisite_for:    { tier: stable }
  practiced_by:        { object: [community], tier: stable }
  originates_from:     { tier: stable }
  signals_membership:  { object: [community], tier: stable }
  serves:              { tier: stable }
  located_at:          { object: [venue, landmark, stage, gate], tier: stable }
  # HOT — announced-then-revised operational parameters; a stale answer sends someone to a closed gate.
  operating_hours:     { object: [literal], tier: hot }
  service_constraint:  { object: [literal], tier: hot }
  prohibits:           { tier: stable }
  requires:            { tier: stable }
  succeeded_by:        { object: [edition], tier: stable }
  differs_from:        { tier: stable }
  incident_occurred:   { object: [incident_class], tier: stable }
  structurally_similar: { tier: stable }
  belongs_to_class:    { object: [incident_class, festival, edition], tier: stable }
  inherits_norms_from: { object: [edition, festival], tier: stable }

# (C) relation taxonomy + BALANCE TARGETS + the per-fact EXPOSURE CAP (catches defects #1 monoculture & #2 runaway).
#     `needs` is the SOURCE-GAP key: when a relation is missing/thin, gate_source_vs_gap probes these artifacts —
#     all absent ⇒ SOURCE GAP (reported, never penalized); present/empty-needs ⇒ DEFECT (a generation failure).
relations:
  exposure_cap_per_fact: 60      # COMPUTE-FOOTPRINT threshold, NOT a quality cap. Redundancy installs knowledge
                                 # (gold repeats key facts up to ~260×); this only WARNs when the TYPICAL fact's
                                 # line-count (median) exceeds this — i.e. systemic over-replication that wastes
                                 # compute + flattens the importance signal. It never fails the suite.
  dominance_max_frac: 0.85       # no single relation_type may exceed this fraction (gold 0.824 passes, VC1 0.983 fails;
                                 # principled long-term target ≈0.50 — ratchet down as gold's monoculture is fixed)
  min_active_types: 6            # at least this many DISTINCT relation_types must be present (VC1 had 8, but 4 GOLD types absent)
  taxonomy:
    artist_to_stage:            { needs: [],                              floor_frac: 0.10, target_frac: 0.35 }
    in_lineup:                  { needs: [in_lineup_source],              floor_frac: 0.05 }
    set_time:                   { needs: [set_times.jsonl],               floor_frac: 0.03 }
    disjoint_context:           { needs: [festival_meta.confusable_groups], floor_frac: 0.02 }
    day_of_week_map:            { needs: [festival_meta.days],            floor_frac: 0.002 }
    b2b_pairing:                { needs: [b2b_billing],                   floor_frac: 0.002 }
    stage_to_genre:             { needs: [],                              floor_frac: 0.002 }
    stage_roster:               { needs: [],                              floor_frac: 0.002 }
    stage_production_character: { needs: [],                              floor_frac: 0.002 }
    stage_brand:                { needs: [],                              floor_frac: 0.002 }
    stage_rank_capacity:        { needs: [],                              floor_frac: 0.002 }
    recommendation:             { needs: [],                              floor_frac: 0.002 }
    multi_stage:                { needs: [],                              floor_frac: 0.001 }

# PROTECTED editions — the hand-built reference corpus the rebuild must NEVER overwrite. The agent loop
# gate-checks these but skips extract/hydrate (read-only). las_vegas/2026 is the gold (hand-curated
# 15_structured + 25_hydrated + set_times.jsonl + confusable_groups — not regenerable).
protected_editions: [las_vegas/2026]

# (D) gate thresholds + the source-gap artifact probes. `required_artifacts` maps a logical `needs` key to an
#     on-disk probe relative to the edition dir; `file#jsonkey` means "the JSON file must exist AND have a
#     non-empty value at that top-level key" (e.g. festival_meta.json must contain a populated `days` list).
quality:
  faithfulness:
    max_foreign_entity_frac: 0.02   # hydrated lines naming a non-source entity (small tolerance for tokenizer noise)
    refusal_signatures: ["cannot fulfill", "i cannot", "i can't", "as an ai", "i'm sorry", "does not specify",
                          "no information", "i don't have", "unable to", "here is", "here's a", "sure,"]
  id_integrity:
    max_object_contract_violation_frac: 0.0   # every constrained predicate's object must match its allowed types
    max_dangling_frac: 0.0                     # subject/object id must exist in entities.jsonl (or be global:*)
    require_edition_match: true                # an id in edition E must carry E's festival_slug (or global:)
    year_bearing_types: [stage, set, artist, day]   # these slugs must not carry a FOREIGN year (cross-edition contamination)
  source_gap:
    required_artifacts:
      set_times.jsonl:                 "set_times.jsonl"
      # '#days.date' (not bare '#days'): every edition is scaffolded with a {Friday/Saturday/Sunday}
      # skeleton, but only an edition with REAL dates can produce day_of_week_map — so a dateless edition
      # is a correct SOURCE GAP, not a generation defect (the gold keeps real dates → stays defect-eligible).
      festival_meta.days:              "festival_meta.json#days.date"
      festival_meta.confusable_groups: "festival_meta.json#confusable_groups"
      # content probe: b2b_pairing's source is a B2B billing in the lineup (e.g. "Shimon B2B Benny L"); an
      # edition with one but no b2b_pairing line is a DEFECT, an edition with none is a SOURCE GAP.
      b2b_billing:                     "15_structured/entities.jsonl~B2B"
      # content probe: in_lineup (stageless lineup membership) is expected only where in_lineup triples
      # exist — the gold uses stage-level plays_at, so it has none → in_lineup is a SOURCE GAP there, not a defect.
      in_lineup_source:                "15_structured/triples.jsonl~in_lineup"
