# Domain manifest — pokemon-lore. RUNNABLE (Kanto pilot, 2026-07-12): the Phase-6a second-domain proof.
# Mirrors configs/domains/edc.yaml but rides the GENERIC path (_TEMPLATE.yaml shape): spec-driven extraction
# from the entity_types/predicates below, generic_expand/generic_synth hydration from configs/templates/
# pokemon-lore.yaml, generic_probes eval items. Pairs with the qgre-agent ontology, kept in lockstep:
#   knowledge/domains/pokemon-lore.{md,probes.md}   (in the qgre-agent repo)
#
# PILOT SCOPE: one region unit (kanto) — 111 Bulbapedia articles content-selected from the 2026-06-07 sweep
# in data/pokemon-lore/00_raw (>=2 "Kanto" mentions), hardlinked into data/pokemon-lore/kanto/00_raw.
# The `scrape` stage is intentionally ABSENT: the raw corpus already exists on disk; a pokemon_lore source
# module (scripts/scrape/sources/) is authored when the multi-region sweep needs refreshing.

name: pokemon-lore
description: Pokémon narrative corpus — characters, regions, organizations, events, species-as-told (lore only).

# Lore is REGION-partitioned (continuity rides on attrs, never a partition). Cf. EDC's festival→city→year.
hierarchy: [region]
registry: configs/editions_pokemon-lore.json   # the region registry iter_editions walks (kanto pilot)
templates: configs/templates/pokemon-lore.yaml # hydrate/sft/synth templates — the domain's authored content

ontology:
  schema_dir: schema                            # shared core schemas (entity/triple/discourse/metadata)
  kind: pokemon lore                            # "a pokemon lore knowledge graph"
  name: Pokémon                                 # the proper noun the sources are about
  topics: [characters_and_bonds, regions_and_locations, organizations_and_factions,
           story_events_and_timeline, species_lore_and_myth, rivalries_and_alliances,
           mentorship_and_growth, legendary_and_mythical, continuity_and_canon]
  stances: [canon, anime, manga, movie, contested, neutral]
  # provenance class → confidence. Lore wikis are community-vetted; primary canon (games/anime) is official.
  confidence_map:
    primary-canon: official            # in-game text, anime episodes themselves
    wiki-bulbapedia: cross-confirmed    # Bulbapedia — heavily sourced, the canonical lore reference
    wiki-fandom: community-vetted       # pokemon.fandom.com
    community-discussion: single-anecdote
    inferred-by-model: inferred

model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it   # durable models home (…/dev/models was retired)
configs:
  cpt: configs/train_pokemon_lore_kanto_v1.yaml   # Phase 6b — the pilot CPT run
  sft: null                                       # authored after the CPT install verdict

vars:
  corpus: pokemon_lore_kanto_v1     # the tokenized Arrow basename this pilot produces

# Ordered pipeline (generic path). Placeholders: {py}=.venv/bin/python, {root}, {editions}, {corpus}, {cpt}.
stages:
  - name: extract
    desc: "10_clean — flat-corpus conversion (.txt passthrough, .html via trafilatura) + provenance sidecars"
    cmd: ["{py}", "scripts/clean_flat_corpus.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--domain-class", "wiki-bulbapedia"]
    gpu: false
  - name: structured
    desc: "15_structured — LLM entity/triple/discourse extraction (spec-driven from the ontology below)"
    cmd: ["{py}", "scripts/extract_structured.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--concurrency", "16", "--yes"]
    gpu: false
  - name: split
    desc: "immutable subject-grouped split_v1.json — TRAIN augmentation vs HOLDOUT probe gold"
    cmd: ["{py}", "scripts/pipeline/split.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: hydrate
    desc: "25_hydrated — deterministic per-predicate template FLOOR (generic, faithful by construction)"
    cmd: ["{py}", "scripts/pipeline/generic_expand.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: synth
    desc: "25_hydrated — LLM DIVERSITY layer (per-fact paraphrases; the install layer on top of the floor)"
    cmd: ["{py}", "scripts/pipeline/generic_synth.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: probes
    desc: "eval items — forced-choice probes over held-out triples (the eval-axis skeleton)"
    cmd: ["{py}", "scripts/pipeline/generic_probes.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: audit
    desc: "CPU data audit — distribution/static dimensions (the base-model latent pass is explicitly skipped)"
    cmd: ["{py}", "scripts/data_audit.py", "--domain", "pokemon-lore", "--editions", "{editions}", "--no-gpu"]
    gpu: false
  - name: tokenize
    desc: "30_tokenized — pack clean+hydrated+replay → Arrow + lever metadata (the Phase 6a milestone)"
    cmd: ["{py}", "scripts/tokenize_corpus.py", "--domain", "pokemon-lore", "--seq-len", "512",
          "--replay-frac", "0.10", "--out", "{corpus}"]
    gpu: false
  - name: cpt
    desc: "continued pretraining (FP4 + int8-master), eager path — decision-3 megakernel rule operator-overridden"
    cmd: ["bash", "scripts/train_fp4.sh", "--config", "{cpt}"]
    gpu: true

# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# ONTOLOGY (spec-driven extraction reads these — pipeline/ontology.py). Lifted from the qgre-agent
# pokemon-lore schemas: 6 entity types, the lore relation taxonomy with predicate→object-type contracts.

# (A) entity types — the closed enum gate_id_integrity types every id's `<domain>:TYPE:slug` against.
entity_types:
  [region, location, character, organization, event, species_lore]

# (B) predicates + the predicate→OBJECT-TYPE CONTRACT. BASE (extracted from prose) then DERIVED (ordered/
#     computed). `object` declares the entity_types an object id may be; no `object` key = unconstrained.
predicates:
  # BASE
  located_in:        { object: [region] }                               # location|organization → region
  originates_from:   { object: [region] }                               # character|species_lore → region
  member_of:         { object: [organization] }
  leads:             { object: [organization] }
  allied_with:       { object: [character, organization] }
  rival_of:          { object: [character, organization] }
  opposes:           { object: [character, organization] }
  mentors:           { object: [character] }
  partners_with:     { object: [species_lore] }                         # the Ash↔Pikachu bond class
  owns_pokemon:      { object: [species_lore] }
  occurs_at:         { object: [location] }                             # event → location
  involves:          { object: [character, organization, species_lore] }
  appears_in:        { object: [region, event] }
  governs:           { object: [region, location] }
  # DERIVED
  precedes:          { object: [event] }
  follows:           { object: [event] }
  causes:            { object: [event] }
  evolves_into_lore: { object: [species_lore] }   # evolution-as-lore — SEPARATE from the Pokedex `evolves_into` fact

# (C) balance targets + exposure cap — pure distribution properties (reused from EDC; nothing festival-specific).
relations:
  exposure_cap_per_fact: 60
  dominance_max_frac: 0.85
  min_active_types: 6

# (D) audit thresholds — the typed-graph gates fail-closed on these (same shape as _selftest).
quality:
  faithfulness:
    max_foreign_entity_frac: 0.02
  id_integrity:
    max_object_contract_violation_frac: 0.0
    max_dangling_frac: 0.0
    require_edition_match: true
