# Domain manifest — pokemon-lore. RUNNABLE (Kanto pilot, 2026-07-12): the Phase-6a second-domain proof.
# Mirrors configs/domains/edc.yaml but rides the GENERIC path (_TEMPLATE.yaml shape): spec-driven extraction
# from the entity_types/predicates below, generic_expand/generic_synth hydration from configs/templates/
# pokemon-lore.yaml, generic_probes eval items. Pairs with the qgre-agent ontology, kept in lockstep:
#   knowledge/domains/pokemon-lore.{md,probes.md}   (in the qgre-agent repo)
#
# PILOT SCOPE: one region unit (kanto) — 111 Bulbapedia articles content-selected from the 2026-06-07 sweep
# in data/pokemon-lore/00_raw (>=2 "Kanto" mentions), hardlinked into data/pokemon-lore/kanto/00_raw.
# The `scrape` stage is intentionally ABSENT: the raw corpus already exists on disk; a pokemon_lore source
# module (scripts/scrape/sources/) is authored when the multi-region sweep needs refreshing.

name: pokemon-lore
kind: facts
description: Pokémon narrative corpus — characters, regions, organizations, events, species-as-told (lore only).

# Lore is REGION-partitioned (continuity rides on attrs, never a partition). Cf. EDC's festival→city→year.
hierarchy: [region]
registry: configs/editions_pokemon-lore.json   # the region registry iter_editions walks (kanto pilot)
templates: configs/templates/pokemon-lore.yaml # hydrate/sft/synth templates — the domain's authored content

ontology:
  schema_dir: schema                            # shared core schemas (entity/triple/discourse/metadata)
  kind: pokemon lore                            # "a pokemon lore knowledge graph"
  name: Pokémon                                 # the proper noun the sources are about
  topics: [characters_and_bonds, regions_and_locations, organizations_and_factions,
           story_events_and_timeline, species_lore_and_myth, rivalries_and_alliances,
           mentorship_and_growth, legendary_and_mythical, continuity_and_canon]
  stances: [canon, anime, manga, movie, contested, neutral]
  # provenance class → confidence. Lore wikis are community-vetted; primary canon (games/anime) is official.
  confidence_map:
    primary-canon: official            # in-game text, anime episodes themselves
    wiki-bulbapedia: cross-confirmed    # Bulbapedia — heavily sourced, the canonical lore reference
    wiki-fandom: community-vetted       # pokemon.fandom.com
    community-discussion: single-anecdote
    inferred-by-model: inferred

model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it   # durable models home (…/dev/models was retired)
configs:
  cpt: configs/train_pokemon_lore_kanto_v1.yaml   # Phase 6b — the pilot CPT run
  sft: configs/sft_pokemon_lore_kanto_v1.yaml     # Phase C residual — hard-neg SFT on the CPT ckpt

vars:
  corpus: pokemon_lore_kanto_v1     # the tokenized Arrow basename this pilot produces

# Ordered pipeline (generic path). Placeholders: {py}=.venv/bin/python, {root}, {editions}, {corpus}, {cpt}.
stages:
  - name: extract
    desc: "10_clean — flat-corpus conversion (.txt passthrough, .html via trafilatura) + provenance sidecars"
    cmd: ["{py}", "scripts/clean_flat_corpus.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--domain-class", "wiki-bulbapedia"]
    gpu: false
  - name: pii_scan
    desc: "PII quarantine/mask (non-destructive) — wiki corpora usually sparse; still runs"
    cmd: ["{py}", "scripts/pipeline/pii_scan.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: score_educational
    desc: "educational-density teacher scores (1–5) for curate"
    cmd: ["{py}", "scripts/pipeline/score_educational.py", "--domain", "pokemon-lore", "--editions", "{editions}", "--mode", "facts"]
    gpu: false
  - name: curate
    desc: "educational×trust drop + rarity guard + PII quarantine → keep_list_pokemon-lore.json"
    cmd: ["{py}", "scripts/curate_corpus.py", "--domain", "pokemon-lore", "--no-difficulty"]
    gpu: true
  - name: structured
    desc: "15_structured — LLM entity/triple/discourse extraction (spec-driven from the ontology below)"
    cmd: ["{py}", "scripts/extract_structured.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--concurrency", "16", "--yes"]
    gpu: false
  - name: resolve
    desc: "entity canonicalization (alias merge; continuity hard wall) before split"
    cmd: ["{py}", "scripts/pipeline/resolve_entities.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: true
  - name: split
    desc: "immutable split_v2.json — alias+inverse-closed TRAIN vs HOLDOUT (new eval series)"
    cmd: ["{py}", "scripts/pipeline/split.py", "--domain", "pokemon-lore", "--editions", "{editions}", "--version", "v2"]
    gpu: false
  - name: hydrate
    desc: "25_hydrated — deterministic per-predicate template FLOOR (generic, faithful by construction)"
    cmd: ["{py}", "scripts/pipeline/generic_expand.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: synth
    desc: "25_hydrated — LLM DIVERSITY layer (per-fact paraphrases + persona/temp variation)"
    cmd: ["{py}", "scripts/pipeline/generic_synth.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: contrast
    desc: "25_hydrated — truth-validated contrast surfaces (soft-cap 10%; SFT hard-negs are primary)"
    cmd: ["{py}", "scripts/pipeline/generic_contrast.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--max-fraction", "0.10"]
    gpu: false
  - name: reasoning
    desc: "25_hydrated — LLM-rendered reasoning walks over connected TRAIN triple sets (soft-cap 10%)"
    cmd: ["{py}", "scripts/pipeline/generic_reasoning.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--max-fraction", "0.10", "--variations", "2"]
    gpu: false
  - name: dedup_surfaces
    desc: "SemDeDup hydrated surfaces (non-destructive exclusion list; floor-protected)"
    cmd: ["{py}", "scripts/pipeline/dedup_surfaces.py", "--domain", "pokemon-lore", "--editions", "{editions}"]
    gpu: false
  - name: probes
    desc: "eval items — forced-choice probes over held-out triples (the eval-axis skeleton)"
    cmd: ["{py}", "scripts/pipeline/generic_probes.py", "--domain", "pokemon-lore", "--editions", "{editions}",
          "--surfaces-per-gold", "4"]
    gpu: false
  - name: audit_recall
    desc: "extraction coverage gate (provider) — FAIL → re-extract, not re-train"
    cmd: ["{py}", "scripts/pipeline/audit_recall.py", "--domain", "pokemon-lore", "--editions", "{editions}", "--min-coverage", "0.6"]
    gpu: false
  - name: audit
    desc: "CPU data audit — distribution/static dimensions + diversity gate (distinct-n)"
    cmd: ["{py}", "scripts/data_audit.py", "--domain", "pokemon-lore", "--editions", "{editions}", "--no-gpu"]
    gpu: false
  - name: tokenize
    desc: "30_tokenized — pack clean+hydrated+replay → Arrow + lever metadata (the Phase 6a milestone)"
    cmd: ["{py}", "scripts/tokenize_corpus.py", "--domain", "pokemon-lore", "--seq-len", "512",
          "--replay-frac", "0.10", "--out", "{corpus}"]
    gpu: false
  - name: cpt
    desc: "continued pretraining (FP4 + int8-master), eager path — decision-3 megakernel rule operator-overridden"
    cmd: ["bash", "scripts/train_fp4.sh", "--config", "{cpt}"]
    gpu: true

# ─────────────────────────────────────────────────────────────────────────────────────────────────────
# ONTOLOGY (spec-driven extraction reads these — pipeline/ontology.py). Lifted from the qgre-agent
# pokemon-lore schemas: 6 entity types, the lore relation taxonomy with predicate→object-type contracts.

# (A) entity types — the closed enum gate_id_integrity types every id's `<domain>:TYPE:slug` against.
entity_types:
  [region, location, character, organization, event, species_lore]

# (B) predicates + the predicate→OBJECT-TYPE CONTRACT. BASE (extracted from prose) then DERIVED (ordered/
#     computed). `object` declares the entity_types an object id may be; no `object` key = unconstrained.
predicates:
  # BASE — optional `guidance` is surfaced in Ontology.system() (EDC omits it → parity preserved).
  # Phase G: starved-predicate under-specification was the dominant clean-coverage gap class.
  # tier: stable|hot|proven (trust-loop/04). Undeclared → hot. Lore facts are durable → stable.
  located_in:        { object: [region], tier: stable }
  originates_from:
    object: [region]
    tier: stable
    guidance: >-
      character or species_lore whose home/native region the text names (born in, native to,
      from the X region). Object is the region entity, never a city.
  member_of:         { object: [organization], tier: stable }
  leads:
    object: [organization]
    tier: stable
    guidance: >-
      character who is the boss/leader/admin of an organization (Gym Leader of a Gym is governs,
      not leads; leads is for Team Rocket boss, Elite Four chair, foundation president).
  allied_with:
    object: [character, organization]
    tier: stable
    guidance: >-
      characters/orgs who fight on the same side, help each other, team up, or are named as allies
      or partners in a conflict. Distinct from opposes (enemies) and rival_of (competitive rivalry).
      "X helped Y escape" / "X and Y joined forces" → allied_with.
  rival_of:
    object: [character, organization]
    tier: stable
    guidance: >-
      named competitive rivalry or peer contest (rival trainers, competing gyms). Not wartime enemies
      (use opposes) and not teammates (use allied_with).
  opposes:
    object: [character, organization]
    tier: stable
    guidance: >-
      direct antagonism — fights against, thwarts, is enemy of. Team Rocket opposes the police;
      a hero opposes a villain team. Do not use for friendly rivalry.
  mentors:           { object: [character], tier: stable }
  partners_with:     { object: [species_lore], tier: stable }
  owns_pokemon:
    object: [species_lore]
    tier: stable
    guidance: >-
      a trainer/character who keeps, battles with, or is shown possessing a species. Object is the
      species_lore entity (Pikachu, Mewtwo), not a nickname alone.
  occurs_at:         { object: [location], tier: stable }
  involves:
    object: [character, organization, species_lore]
    tier: stable
    guidance: >-
      an EVENT (battle, episode, mission, crisis) that features a character, organization, or
      species as a participant. Subject should be the event; object the participant. Do NOT use
      involves as a generic "related to" between two characters (prefer allied_with/opposes/mentors).
  appears_in:
    object: [region, event]
    tier: stable
    guidance: >-
      character or species_lore featured in a region's lore, games set there, or a named event.
      Legends about species in a region (Swords of Justice in Unova, legendaries racing across a
      region) AND characters who debut/appear in a region or tournament all use appears_in.
      Object is the region or event — never a game title literal unless modeled as an event entity.
  governs:
    object: [region, location]
    tier: stable
    guidance: >-
      character who rules, administers, or is Gym Leader / Champion of a place. Object is the
      location or region they govern (Fuchsia Gym, Viridian City, Indigo League) — prefer the
      most specific place the text names (the Gym over the city when both appear).
  # DERIVED (stable timeline relations)
  precedes:          { object: [event], tier: stable }
  follows:           { object: [event], tier: stable }
  causes:            { object: [event], tier: stable }
  evolves_into_lore: { object: [species_lore], tier: stable }
  # HOT — volatile / never trained (red-green: hydrate filter drops these)
  current_season:
    object: [event]
    tier: hot
    guidance: >-
      the currently airing anime season or live event window. VOLATILE — retrieval only, never CPT.


# (C) balance targets + exposure cap — pure distribution properties (reused from EDC; nothing festival-specific).
relations:
  exposure_cap_per_fact: 60
  dominance_max_frac: 0.85
  min_active_types: 6

# (D) audit thresholds — the typed-graph gates fail-closed on these (same shape as _selftest).
quality:
  faithfulness:
    max_foreign_entity_frac: 0.02
  id_integrity:
    max_object_contract_violation_frac: 0.0
    max_dangling_frac: 0.0
    require_edition_match: true
  diversity:
    min_distinct_2: 0.35
    max_nn_cosine_p90: 0.90
