# Engine self-test fixture — a DELIBERATELY non-festival domain that gates the de-festivalized path
# end-to-end. NOT a real corpus: scientific instruments + materials, six triples, ZERO festival tokens.
# Its only purpose is to make "the engine generates a non-EDC domain with no festival bleed" a RUNNING
# test (scripts/pipeline/test_selftest_domain_e2e.py), not a manual audit — the byte-identity goldens only
# ever execute EDC, so a festival assumption that leaks onto the generic path is invisible to them but turns
# this fixture RED. It is also SINGLE-LEVEL (one `collection` unit, no city/year) — proving the generalized
# editions layer (iter_editions) handles a non-festival unit shape, not just festival city/year.
name: _selftest
description: Abstract scientific instruments — the engine's non-festival self-test fixture.

hierarchy: [collection]
registry: configs/editions__selftest.json
templates: configs/templates/_selftest.yaml

ontology:
  schema_dir: schema
  kind: instrument catalogue
  name: Instruments
  topics: [optics, measurement]
  stances: [descriptive, neutral]
  confidence_map:
    reference: official

model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2

vars:
  corpus: _selftest_v1

# Pre-wired to the GENERIC tools — exactly what _TEMPLATE.yaml ships (no festival scripts).
stages:
  - name: hydrate
    desc: "25_hydrated — deterministic per-predicate template floor (generic)"
    cmd: ["{py}", "scripts/pipeline/generic_expand.py", "--domain", "_selftest", "--editions", "{editions}"]
    gpu: false
  - name: synth
    desc: "25_hydrated — LLM diversity layer (generic)"
    cmd: ["{py}", "scripts/pipeline/generic_synth.py", "--domain", "_selftest", "--editions", "{editions}"]
    gpu: false
  - name: probes
    desc: "eval items — forced-choice probes (generic)"
    cmd: ["{py}", "scripts/pipeline/generic_probes.py", "--domain", "_selftest", "--editions", "{editions}"]
    gpu: false
  - name: audit
    desc: "CPU data audit — distribution/static dimensions (the base-model latent pass is explicitly skipped)"
    cmd: ["{py}", "scripts/data_audit.py", "--domain", "_selftest", "--editions", "{editions}", "--no-gpu"]
    gpu: false

entity_types:
  [instrument, material]

predicates:
  made_of:  { object: [material] }
  measures: { object: [literal] }
  origin:   { object: [literal] }

relations:
  exposure_cap_per_fact: 60
  dominance_max_frac: 0.85
  min_active_types: 2

quality:
  faithfulness:
    max_foreign_entity_frac: 0.02
  id_integrity:
    max_object_contract_violation_frac: 0.0
    max_dangling_frac: 0.0
    require_edition_match: true
