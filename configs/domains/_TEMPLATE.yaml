# ─────────────────────────────────────────────────────────────────────────────
# DOMAIN MANIFEST SKELETON — copy to configs/domains/<your-domain>.yaml and fill the <...> placeholders.
#
# This is the config-driven declaration of a full scrape→…→sft pipeline for ONE domain. The generic
# machinery (extraction, validation, hydration, synth, probes, audit, tokenizer, CPT/SFT) is
# domain-agnostic; what you author is the corpus SHAPE: the ontology (entity_types + predicates), the
# unit registry, and the templates (configs/templates/<your-domain>.yaml — copy _TEMPLATE.yaml there).
# Stages below are pre-wired to the GENERIC tools. Pairs with the qgre-agent playbook domains/_TEMPLATE.md.
# ─────────────────────────────────────────────────────────────────────────────

name: <your-domain>
description: <one line — what this corpus is about>

# Path fork (docs/cpt-overhaul/05). facts = graph/hydrate (default). style = persona/voice path
# (fingerprint → real-text bulk + register expansions). mixed = both, sub-corpora disjoint at ingest.
kind: facts   # facts | style | mixed

# Data hierarchy under data/<name>/<...>. A festival is festival→city→year; another domain might be
# [product, version], [region], [author, work], … The unit of partition is the LAST level.
hierarchy: [<unit>]
registry: configs/editions_<your-domain>.json   # the unit registry iter_editions walks (author it: a JSON list of units)

ontology:
  schema_dir: schema                             # shared record-shape JSON-Schemas (validation enums come from the manifest, not here)
  kind: <your subject kind>                       # e.g. "product manual" → "a product-manual knowledge graph"
  name: <Proper Noun the sources are about>
  topics: [<topic_a>, <topic_b>]                  # the discourse topics (free list)
  stances: [<stance_a>, <stance_b>, neutral]      # the discourse stances
  confidence_map:                                 # provenance class → confidence (pipeline-owned, never model-invented)
    <source-class>: official

model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
configs:
  cpt: configs/train_<your-domain>.yaml           # authored when you reach training (Phase 6b)
  sft: configs/sft_<your-domain>.yaml

vars:
  corpus: <your-domain>_v1                        # the tokenized Arrow basename

# Ordered pipeline — pre-wired to the GENERIC tools. Placeholders: {py}=.venv/bin/python, {root}, {editions}, + vars.
stages:
  - name: scrape
    desc: "00_raw — fetch your sources. Author scripts/scrape/sources/<your-domain>.py (copy sources/_TEMPLATE.py)."
    cmd: ["{py}", "-m", "scrape", "--domain", "<your-domain>"]
    gpu: false
  - name: extract
    desc: "10_clean — trafilatura + LLM rescue → clean markdown"
    cmd: ["{py}", "-m", "extract", "--domain", "{domain}", "--editions", "{editions}", "--llm-rescue"]
    gpu: false
  - name: pii_scan
    desc: "PII quarantine/mask (non-destructive) — mandatory for own-data/style corpora"
    cmd: ["{py}", "scripts/pipeline/pii_scan.py", "--domain", "{domain}", "--editions", "{editions}"]
    gpu: false
  # Style path only (kind: style|mixed). REFUSE below ~2k msgs / ~20k tokens of real user text.
  # - name: style_fingerprint
  #   desc: "style card — mechanical fingerprint + optional LLM register prose; human-approved"
  #   cmd: ["{py}", "scripts/pipeline/style_fingerprint.py", "--domain", "{domain}", "--editions", "{editions}"]
  #   gpu: false
  - name: score_educational
    desc: "educational-density teacher scores (1–5) → sidecars for curate; omit on device-only"
    cmd: ["{py}", "scripts/pipeline/score_educational.py", "--domain", "{domain}", "--editions", "{editions}", "--mode", "facts"]
    gpu: false
  - name: curate
    desc: "educational×trust drop + rarity guard + PII quarantine honor → domain-scoped keep-list"
    cmd: ["{py}", "scripts/curate_corpus.py", "--domain", "{domain}", "--no-difficulty"]
    gpu: true
  - name: structured
    desc: "15_structured — LLM entity/triple/discourse extraction (spec-driven from entity_types/predicates, schema-validated)"
    cmd: ["{py}", "scripts/extract_structured.py", "--domain", "{domain}", "--editions", "{editions}", "--concurrency", "16", "--yes"]
    gpu: false
  - name: resolve
    desc: "entity canonicalization (alias merge; continuity hard wall) — before split"
    cmd: ["{py}", "scripts/pipeline/resolve_entities.py", "--domain", "{domain}", "--editions", "{editions}"]
    gpu: true
  # Optional holdout carve (uncomment before hydrate). v2 = alias+inverse-closed (new eval series).
  # - name: split
  #   desc: "immutable split_v2.json — alias+inverse-closed TRAIN vs HOLDOUT"
  #   cmd: ["{py}", "scripts/pipeline/split.py", "--domain", "{domain}", "--editions", "{editions}", "--version", "v2"]
  #   gpu: false
  - name: hydrate
    desc: "25_hydrated — deterministic per-predicate template FLOOR (generic, faithful by construction)"
    cmd: ["{py}", "scripts/pipeline/generic_expand.py", "--domain", "<your-domain>", "--editions", "{editions}"]
    gpu: false
  - name: synth
    desc: "25_hydrated — LLM DIVERSITY layer (per-fact paraphrases + persona/temp variation)"
    cmd: ["{py}", "scripts/pipeline/generic_synth.py", "--domain", "<your-domain>", "--editions", "{editions}"]
    gpu: false
  # Optional confusable-value surfaces (uncomment after hydrate; no authored contrast block = reported no-op).
  # - name: contrast
  #   desc: "25_hydrated — truth-validated contrast surfaces from the domain template's contrast block"
  #   cmd: ["{py}", "scripts/pipeline/generic_contrast.py", "--domain", "{domain}", "--editions", "{editions}", "--max-fraction", "0.10"]
  #   gpu: false
  # Optional surface dedup (after synth; non-destructive exclusion list the tokenizer honors).
  # - name: dedup_surfaces
  #   desc: "SemDeDup hydrated surfaces — floor-protected; nothing deleted from 25_hydrated/"
  #   cmd: ["{py}", "scripts/pipeline/dedup_surfaces.py", "--domain", "{domain}", "--editions", "{editions}"]
  #   gpu: false
  - name: probes
    desc: "eval items — forced-choice probes over held-out triples (the eval-axis skeleton)"
    cmd: ["{py}", "scripts/pipeline/generic_probes.py", "--domain", "<your-domain>", "--editions", "{editions}"]
    gpu: false
  # Optional extraction-coverage gate (provider). FAIL → second extraction pass, not a train iteration.
  # - name: audit_recall
  #   desc: "extraction coverage gate — FAIL names weak predicates; re-extract, don't re-train"
  #   cmd: ["{py}", "scripts/pipeline/audit_recall.py", "--domain", "{domain}", "--editions", "{editions}", "--min-coverage", "0.6"]
  #   gpu: false
  - name: audit
    desc: "CPU data audit — distribution/static dimensions + diversity gate (distinct-n)"
    cmd: ["{py}", "scripts/data_audit.py", "--domain", "<your-domain>", "--editions", "{editions}", "--no-gpu"]
    gpu: false
  - name: tokenize
    desc: "30_tokenized — pack clean+hydrated+replay → Arrow + lever metadata"
    cmd: ["{py}", "scripts/tokenize_corpus.py", "--domain", "<your-domain>", "--seq-len", "512", "--replay-frac", "0.10", "--out", "{corpus}"]
    gpu: false
  # cpt + build_sft + sft stages are authored at Phase 6b (training), pointing at configs.cpt/configs.sft.

# ── ONTOLOGY (spec-driven extraction reads these — pipeline/ontology.py + schema_validate.py) ───────────
# (A) entity types — the closed enum gate_id_integrity types every id's `<domain>:TYPE:slug` against.
entity_types:
  [<entity_type_a>, <entity_type_b>]

# (B) predicates + the predicate→OBJECT-TYPE CONTRACT. `object` declares the entity_types an object id may
#     be (`[literal]` = a free value); no `object` key = unconstrained (the gate skips it).
predicates:
  <your_predicate_a>:  { object: [<entity_type_b>] }
  <your_predicate_b>:  {}

# (C) balance targets + the per-fact exposure cap — pure DISTRIBUTION properties (nothing domain-specific).
relations:
  exposure_cap_per_fact: 60
  dominance_max_frac: 0.85
  min_active_types: 6

# (D) gate thresholds. `year_bearing_types` is OPTIONAL + festival-axis: list the entity types whose slug
#     must NOT carry a unit-token (the cross-unit contamination check). OMIT for a domain without that risk.
quality:
  faithfulness:
    max_foreign_entity_frac: 0.02
  id_integrity:
    max_object_contract_violation_frac: 0.0
    max_dangling_frac: 0.0
    require_edition_match: true
  diversity:
    min_distinct_2: 0.35          # collapse detector (unique bigrams / total)
    max_nn_cosine_p90: 0.90       # optional embedding NN; needs --diversity-embeddings
  # year_bearing_types: [<types whose slug must not carry the unit token>]   # festival-only; omit otherwise
