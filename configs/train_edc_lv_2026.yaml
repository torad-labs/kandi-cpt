# Full-param CPT — EDC Las Vegas 2026, Gemma 4 E2B text decoder. THE CANONICAL CPT.
# Precision policy: NO FP32 tensors (bf16 params/grads, low-bit AdamW states, FP4 via Quartet-II).
#
# ╔══════════════════════════════════════════════════════════════════════════════════════╗
# ║  CANONICAL LAUNCH — ZERO FLAGS:   bash scripts/train_fp4.sh                            ║
# ║  This file IS the run. The trainer takes ONLY --config (+ --mode); there are no        ║
# ║  behavior-override flags (see docs/CONFIG_AUDIT.md + AGENTS.md). Every knob is          ║
# ║  validated at load by scripts/cpt_config.py — a typo'd/unknown key HARD-ERRORS.         ║
# ║  A/B a variant by editing this file or generating a new config; never a flag pile.      ║
# ╚══════════════════════════════════════════════════════════════════════════════════════╝
# Notable canonical values (rationale): train.int8_master=storage = THE MOAT (true int8 1-byte
# master + SR, needs precision=fp4 + single-GPU); train.max_steps=3160 ≈ 3 epochs over 16,863
# v2 blocks; run.save_every=100 → step_* checkpoints for the install-trend eval; decay_frac=0.2
# (WSD last 20% decays to min_lr). model.nvfp4.* are INERT unless precision=nvfp4.

mode: cpt
model:
  model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it
  freeze_embeddings: true
  nvfp4:
    skip_lm_head: true
    skip_embeddings: true
    bf16_first_layers: 2
    bf16_last_layers: 5
data:
  tokenized: data/_build/30_tokenized/corpus_all97_v2.arrow
train:
  precision: fp4
  seq_len: 512
  micro_batch_size: 2
  grad_accum: 8
  lr: 5.0e-05
  min_lr: 5.0e-06
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  adam_eps: 1.0e-08
  grad_clip: 1.0
  optimizer_8bit: false
  optimizer_lowbit: 4
  int8_master: storage
  warmup_steps: 50
  max_steps: 3160
  decay_frac: 0.2
  gradient_checkpointing: true
  levers:
    lever1_entity_loss:
      enabled: false
      entity_loss_weight: 2.5
    lever2_qa_mix:
      enabled: false
      qa_token_fraction: 0.15
      use_chat_template: false
      system_prefix: null
    lever3_three_r:
      enabled: false
      replay_token_fraction: 0.02
      rewarm_peak_lr: 5.0e-05
      ewc:
        enabled: false
        lambda: 1.0
    lever4_exposure_tracking:
      enabled: false
      threshold: 0.8
    lever5_causal_trace:
      enabled: false
      n_facts: 200
      noise_scale: 0.1
      checkpoint: null
run:
  run_name: edc_lv_2026_cpt_v2
  save_dir: checkpoints/cpt/edc_all97_v2
  log_every: 5
  save_every: 100
