# Full-param CPT — EDC Las Vegas 2026, Gemma 4 E2B text decoder.
# Precision policy: NO FP32 tensors (bf16 params/grads, 8-bit AdamW states, FP4 via QAT).
run_name: edc_lv_2026_cpt_v1
model_path: /home/marcos/Documents/dev/models/gemma-4-E2B-it
precision: fp4             # NATIVE NVFP4 training via Quartet-II (real FP4 GEMM fwd + FP4 bwd w/ RHT). bf16 | fp4 (Quartet) | nvfp4 (QAT)

# data
tokenized: data/_build/30_tokenized/corpus_all97.arrow   # full-history multi-edition corpus: 14,034 blocks, 7.18M tokens (246K hydrated lines × 97 editions + clean + LV synth + 10% replay). column `input_ids` = seq_len blocks
seq_len: 512
micro_batch_size: 1
grad_accum: 16

# optimizer — 8-bit AdamW (no FP32 states); bf16 master weights
lr: 5.0e-5
min_lr: 5.0e-6
weight_decay: 0.0
betas: [0.9, 0.95]
adam_eps: 1.0e-8
grad_clip: 1.0
optimizer_8bit: false      # re-tested 2026-05-30: still broken under FSDP2+DTensor (OptimState8bit aten.view.dtype unimplemented). Keep bf16 AdamW.
# WINNING PRECISION RECIPE (default): the L1 w=3 INT8-master run was the best of every run —
# stage@1 0.744 / day@1 0.598 (both best-ever). Low-precision-everything acts as a regularizer on the
# small CPT corpus (3x confirmed: full-precision v6 < 4-bit-opt < INT8-master). Both default ON here;
# override per-run with --optimizer-lowbit / --int8-master / --no-int8-master.
optimizer_lowbit: 4        # torchao AdamW4bit optimizer states (single-GPU only; multi-GPU gracefully falls back to bf16 AdamW)
int8_master: true          # per-step stochastic-rounding snap of 2-D master weights to the symmetric INT8 grid
warmup_steps: 50
max_steps: 2640           # full-history: ~3 epochs over 14,034 blocks (eff. batch 16). LV-2026 facts ~3× their hydrated form-density (~170 exposures, toward the V6 regime that hit 0.744) + all 97 editions covered. save_every 500 → step_* checkpoints for the install-trend eval; WSD decay lands at the 2640 horizon.
decay_frac: 0.2           # WSD: last 20% decays to min_lr

# memory levers (2x 16 GB)
gradient_checkpointing: true
freeze_embeddings: true   # 262K-vocab embeds + (tied) lm_head; CPT uses existing tokens

# NVFP4 QAT selective precision (only used when precision == nvfp4)
nvfp4:
  skip_lm_head: true
  skip_embeddings: true
  bf16_first_layers: 2
  bf16_last_layers: 5     # ~15% of 35 text layers kept BF16

# logging / checkpoint
log_every: 5
save_every: 100

# CPT training levers — every lever defaults OFF/baseline; enable ONE at a time for a clean A/B
# against the current baseline (never two new levers in one run unless explicitly testing interaction).
# Levers 1/2/4 consume the metadata the tokenizer emits (entity_mask/src/fact_ids) — re-tokenize WITHOUT
# --no-lever-metadata before enabling them.
levers:
  lever1_entity_loss:        # concentrate gradient on entity/date/time TARGET tokens (weighted-mean CE)
    enabled: false
    entity_loss_weight: 2.5  # sweep {1.0 baseline, 2.0, 3.0, 5.0}; over-weighting can over-cluster entities
  lever2_qa_mix:             # mix eval-shaped QA + conversations into the CPT stream (format-match the probe)
    enabled: false
    qa_token_fraction: 0.15  # sweep {0.0, 0.10, 0.20, 0.30}; too much starves raw facts
    use_chat_template: false # only if deploying through the Gemma chat template
    system_prefix: null      # if set, every qa/conversation example carries this prefix (train==inference framing)
  lever3_three_r:            # re-warm + re-decay (WSD already) + replay + optional EWC (forgetting control)
    enabled: false
    replay_token_fraction: 0.02   # sweep {0.0, 0.01, 0.05}; needs data/_shared/replay populated
    rewarm_peak_lr: 5.0e-5        # = lr; the stability-plasticity dial (sweep one step down/current/up)
    ewc:
      enabled: false
      lambda: 1.0
  lever4_exposure_tracking:  # passive: log cumulative fact exposures, join to probe pass/fail → extraction curve
    enabled: false
    threshold: 0.8
  lever5_causal_trace:       # standalone analysis (ROME causal tracing) on a frozen checkpoint, no training
    enabled: false
    n_facts: 200
    noise_scale: 0.1         # tune until the clean prediction is fully degraded
    checkpoint: null
