# Anneal-enabled CPT — pokemon-lore Kanto pilot (task 11 polish live run).
# Derived from train_pokemon_lore_kanto_v1.yaml: same precision floor (fp4 + int8 master),
# new tokenized shard with block_tag (+ block_edu_score column; edu scores unavailable →
# tag-only anneal mix), max_steps raised to 550 so anneal.min_steps=500 activates
# (start=495, final 10% mix=hydrated+replay, LR → 0). Pre-anneal ckpt kept as fallback.
#
# Launch: CUDA_VISIBLE_DEVICES=1 bash scripts/train_fp4.sh --config configs/train_pokemon_lore_kanto_anneal.yaml
# Dual-axis eval: same probe set as phase_a (n=72 FC / gen sample), scored on anneal-end.

mode: cpt
model:
  model_path: /home/marcos/Documents/dev/infra/models/gemma-4-E2B-it-int8-v2
  freeze_embeddings: true
  nvfp4:
    skip_lm_head: true
    skip_embeddings: true
    bf16_first_layers: 2
    bf16_last_layers: 5
data:
  tokenized: data/_build/30_tokenized/pokemon_lore_kanto_v1_anneal.arrow
train:
  precision: fp4
  seq_len: 512
  micro_batch_size: 1
  grad_accum: 16
  lr: 5.0e-05
  min_lr: 5.0e-06
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  adam_eps: 1.0e-08
  grad_clip: 1.0
  optimizer_8bit: false
  optimizer_lowbit: 4
  int8_master: storage
  warmup_steps: 20
  max_steps: 550
  decay_frac: 0.2
  gradient_checkpointing: true
  anneal:
    enabled: true
    frac: 0.10
    min_steps: 500
    mix_tags: [hydrated, replay]
    lr_end: 0.0
    require_exposure: true
    keep_pre_anneal_checkpoint: true
  levers:
    lever1_entity_loss:
      enabled: false
      entity_loss_weight: 2.5
    lever2_qa_mix:
      enabled: false
      qa_token_fraction: 0.15
      use_chat_template: false
      system_prefix: null
    lever3_three_r:
      enabled: false
      replay_token_fraction: 0.02
      rewarm_peak_lr: 5.0e-05
      ewc:
        enabled: false
        lambda: 1.0
    lever4_exposure_tracking:
      enabled: false
      threshold: 0.8
    lever5_causal_trace:
      enabled: false
      n_facts: 200
      noise_scale: 0.1
      checkpoint: null
eval:
  probe_domain: pokemon-lore
  probe_editions: kanto
  probe_min_n: 50
  generative_enabled: true
  probe_report_root: logs/probe_evals
run:
  run_name: pokemon_lore_kanto_anneal
  save_dir: checkpoints/cpt/pokemon_lore_kanto_anneal
  log_every: 5
  save_every: 550
