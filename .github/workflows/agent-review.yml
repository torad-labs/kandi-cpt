# Agent review caller. All logic lives in the reusable workflow; this file is
# only the trigger surface and this repo's parameters.
name: agent-review

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to review
        type: number
        required: true
      dry-run:
        description: stop at the preview instead of posting
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  # Real reviews (PR auto-path + @torad-review mentions) share one group per PR
  # so two runs cannot race the sticky status comment. Non-mention issue_comment
  # events still CREATE a workflow run — GitHub has no workflow-level body filter
  # — and the job `if` below skips them. If those noise runs shared this group
  # they sat `pending` for the entire 20–40 min review, then skipped: Actions
  # showed "2 agent-reviews" per PR and looked like the bot's "Review in
  # progress" status comment had re-triggered a review. Isolate noise on run_id.
  group: >-
    agent-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number || github.run_id }}-${{
      github.event_name == 'issue_comment'
      && (github.event.comment.user.type == 'Bot'
          || !contains(github.event.comment.body, '@torad-review'))
      && github.run_id
      || 'work'
    }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Cheap pre-filter so an unrelated comment never even allocates a runner.
    # Requires the @torad-review token (not bare "review") AND a human author —
    # the bot's own status comment is `<!-- torad-review:status -->` (no @) plus
    # user.type Bot; either is enough to skip. Authorization still lives below.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request != null &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.comment.body, '@torad-review'))
    permissions:
      pull-requests: write
    outputs:
      go: ${{ steps.decide.outputs.go }}
      pr: ${{ steps.decide.outputs.pr }}
      provider: ${{ steps.decide.outputs.provider }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          DRAFT: ${{ github.event.pull_request.draft }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOC: ${{ github.event.comment.author_association }}
          COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          go=false
          pr="${PR_NUMBER:-}"
          # Optional "using <provider>" / "--provider <provider>" suffix. Matched
          # against a CLOSED SET and echoed as a fixed literal — the comment text
          # never becomes the value, so an unknown or hostile string degrades to
          # the default instead of reaching the gateway config.
          provider=grok
          case "$(printf '%s' "${COMMENT_BODY:-}" | tr '[:upper:]' '[:lower:]')" in
            *"using kimi"*|*"--provider kimi"*|*"--provider=kimi"*) provider=kimi ;;
            *"using grok"*|*"--provider grok"*|*"--provider=grok"*) provider=grok ;;
            *"using codex"*|*"--provider codex"*|*"--provider=codex"*) provider=codex ;;
          esac
          if [ "$EVENT" = "workflow_dispatch" ]; then
            go=true; why="manual dispatch"
          elif [ "$EVENT" = "issue_comment" ]; then
            pr="$ISSUE_NUMBER"
            if ! printf '%s' "$COMMENT_BODY" | grep -v '^[[:space:]]*>' \
                 | grep -qiE '(^|[[:space:]])@torad-review[[:space:]]+review([[:space:][:punct:]]|$)'; then
              why="mention without the 'review' command"
            elif [ "$COMMENT_USER_TYPE" = "Bot" ]; then
              why="bot commenter"
            else
              case "$COMMENT_ASSOC" in
                OWNER|MEMBER|COLLABORATOR) go=true; why="@torad-review review by $COMMENT_ASSOC" ;;
                *) why="commenter association '$COMMENT_ASSOC' not permitted" ;;
              esac
            fi
          elif [ "$ACTION" = "labeled" ]; then
            if [ "$LABEL" = "agent-review" ]; then go=true; why="agent-review label"; else why="unrelated label"; fi
          elif [ "$IS_FORK" = "true" ]; then
            why="fork PR (label 'agent-review' to review deliberately)"
          elif [ "$AUTHOR" = "dependabot[bot]" ] || [ "$AUTHOR" = "renovate[bot]" ] || [ "$AUTHOR" = "github-actions[bot]" ]; then
            why="dependency-bot author"
          elif [ "$DRAFT" = "true" ]; then
            why="draft"
          else
            case "$TITLE" in
              feat:*|"feat("*|feat!*|fix:*|"fix("*|fix!*) go=true; why="title type is feat/fix" ;;
              *) why="title type is not feat/fix (label 'agent-review' to force)" ;;
            esac
          fi
          { echo "go=$go"; echo "pr=$pr"; echo "provider=$provider"; } >> "$GITHUB_OUTPUT"
          echo "decision: go=$go provider=$provider ($why)"
          echo "Agent review authorize: **$go** — $why (provider: $provider)" >> "$GITHUB_STEP_SUMMARY"

      - name: Acknowledge the mention
        if: ${{ steps.decide.outputs.go == 'true' && github.event_name == 'issue_comment' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          gh api -X POST "repos/${REPO}/issues/comments/${COMMENT_ID}/reactions" -f content=eyes --silent

  review:
    needs: authorize
    if: ${{ needs.authorize.outputs.go == 'true' }}
    permissions:
      contents: read
      pull-requests: write
    uses: torad-labs/github-operator/.github/workflows/reusable-agent-review.yml@0a29be5fbe5410410ec3e53d9a486164c8bf3e1f # v1-131-g0a29be5
    with:
      pr-number: ${{ github.event_name == 'workflow_dispatch' && fromJSON(inputs.pr-number) || fromJSON(needs.authorize.outputs.pr) }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
      provider: ${{ needs.authorize.outputs.provider }}
      model: ''
      timeout-minutes: 120
      # Skills + review-payload.ts must match this reusable pin (CI post snapshots
      # the domain module from the harness checkout).
      harness-ref: 0a29be5fbe5410410ec3e53d9a486164c8bf3e1f
    secrets:
      MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
      KIMI_CODE_JSON: ${{ secrets.KIMI_CODE_JSON }}
      REVIEW_APP_ID: ${{ secrets.REVIEW_APP_ID }}
      REVIEW_APP_PRIVATE_KEY: ${{ secrets.REVIEW_APP_PRIVATE_KEY }}
      CREDENTIAL_SYNC_TOKEN: ${{ secrets.CREDENTIAL_SYNC_TOKEN }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      GROK_AUTH_JSON: ${{ secrets.GROK_AUTH_JSON }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
