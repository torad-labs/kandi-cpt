<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data · Torad Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/torad.css">
<style>
  /* page-local only: the filter caption line. The pipeline-stage rail (.stage-rail/.stage) now lives in
     torad.css as a shared component. */
  .filterbar{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin:-8px 0 14px}
</style>
</head><body>
<script src="/assets/torad.js"></script>
<script>
const slot = T.mountShell({ page: "data", crumbs: [{ label: "Console", href: "/" }, { label: "Data" }] });

// [folder, key, human-readable, description] — the pipeline layers, also the filter chips.
const LAYERS = [
  ["", "all", "all editions", "browse the whole pipeline, by edition"],
  ["00_raw", "raw", "raw", "scraped HTML/JSON, exactly as fetched"],
  ["10_clean", "clean", "clean", "extracted readable text — one doc per page"],
  ["15_structured", "structured", "structured", "entities + triples pulled from the clean text"],
  ["20_synthetic", "synthetic", "synthetic", "templated / LLM-expanded teaching passages"],
  ["25_hydrated", "hydrated", "hydrated", "final relations — the rows that get tokenized"],
  ["holdout", "holdout", "holdout", "held-out probes — never trained on (eval set)"],
];

let IDX = null, OBJ = null, FILTER = "all";

slot.innerHTML = `
  <div class="phead"><div><h1>Data</h1>
    <div class="sub" id="sub">The corpus this objective trains on. Pick a layer below to browse just that stage across every edition, or “all editions” to walk one edition through the whole pipeline. Click any file to read it.</div></div>
    <div class="right" id="hd"></div></div>
  <div class="panel" id="lineage">
    <div class="panel-h"><h2>Trace a fact · verify a layer</h2><span class="note">follow one fact down the pipeline (source → triple → hydrated exposure), or check a layer's health</span></div>
    <div class="formrow">
      <div class="field grow"><div class="lab">Edition</div><input id="trEd" class="inp" list="edlist" aria-label="Edition" placeholder="las_vegas/2026"></div>
      <div class="field grow"><div class="lab">Fact / entity to trace</div><input id="trQ" class="inp" aria-label="Fact or entity to trace" placeholder="e.g. kinetic field"></div>
      <button class="btn" id="trBtn">Trace →</button>
      <div class="field"><div class="lab">Verify layer</div>
        <select id="vfLay" class="sel" aria-label="Pipeline layer to verify"><option>15_structured</option><option selected>25_hydrated</option><option>20_synthetic</option><option>10_clean</option></select></div>
      <button class="btn" id="vfBtn">Verify</button>
      <button class="btn" id="gtBtn" title="Run the deterministic quality gates on this edition">${T.isSimple() ? "Quality check" : "Gate corpus"}</button>
    </div>
    <div class="ex-chips" id="trEx"></div>
    <datalist id="edlist"></datalist>
    <div id="lineageOut" class="mt"></div>
  </div>
  <div class="stage-rail" id="pipe"></div>
  <div class="filterbar" id="fbar"></div>
  <div id="body"></div>`;

function renderPipe() {
  T.$("#pipe").innerHTML = LAYERS.map(([n, k, t, d]) =>
    `<div class="stage ${FILTER === k ? 'on' : ''}" data-k="${k}"><div class="k">${n || '·'}</div><div class="t">${t}</div><div class="d">${d}</div><span class="arr">→</span></div>`).join("");
  T.$$("#pipe .stage").forEach(el => el.onclick = () => { if (FILTER === el.dataset.k) return; FILTER = el.dataset.k; renderPipe(); renderBody(); });
}

(async () => {
  let objs;
  try { [IDX, objs] = await Promise.all([T.fetchJSON("/api/data"), T.fetchJSON("/api/objectives")]); }
  catch (e) { return T.err(T.$("#body"), e.message); }
  OBJ = objs.objectives.find(o => o.id === T.objective()) || {};
  T.$("#sub").innerHTML = `The <b>${T.esc(OBJ.name || IDX.festival)}</b> corpus. Pick a layer to browse just that stage across every edition, or “all editions” to walk one edition through the whole pipeline. Click any file to read it.`;

  if (!IDX.editions.length) {
    T.$("#hd").innerHTML = `<span class="pill trained"><span class="pd"></span>NO DATA YET</span>`;
    T.$("#pipe").style.display = "none";
    T.$("#body").innerHTML = `<div class="panel empty">No corpus on disk for <b>${T.esc(OBJ.name || IDX.festival)}</b> yet.<br>
      Run the scrape + hydrate pipeline into <span class="mono">data/${T.esc(IDX.festival)}/</span> and it will appear here.</div>`;
    return;
  }
  const tot = IDX.editions.reduce((a, e) => ({ d: a.d + e.n_docs, s: a.s + e.n_structured, h: a.h + e.n_hydrated }), { d: 0, s: 0, h: 0 });
  T.$("#hd").innerHTML = `<div class="row gap"><span class="pill info"><span class="pd"></span>${IDX.n_editions} EDITIONS</span>
    <span class="mono dim" style="font-size:11px">${T.fmt(tot.d)} docs · ${T.fmt(tot.s)} triples · ${T.fmt(tot.h)} relations</span></div>`;
  renderPipe();
  renderBody();
  wireLineage();
})();

// ── trace-a-fact + verify-a-layer (the data-lineage engine, over the action catalog) ──
function edKey(e) { return e.edition || e.path || e.key || (e.city && e.year ? `${e.city}/${e.year}` : e.name || ""); }
// pre-filled facts so a first-timer sees what's traceable instead of facing a blank box.
// keyed by festival; the generic fallback teaches the *shape* of a query (an artist, a stage, the city).
const TRACE_EX = {
  edc: ["kinetic field", "deadmau5", "Las Vegas", "circuitGROUNDS", "Tiësto"],
  _default: ["an artist's name", "a stage name", "the host city"],
};
function wireLineage() {
  const eds = (IDX.editions || []).map(edKey).filter(Boolean);
  T.$("#edlist").innerHTML = eds.map(k => `<option value="${T.esc(k)}">`).join("");
  // default to the densest edition (most hydrated relations)
  const densest = (IDX.editions || []).slice().sort((a, b) => (b.n_hydrated || 0) - (a.n_hydrated || 0))[0];
  if (densest) T.$("#trEd").value = edKey(densest);
  const out = T.$("#lineageOut");
  // example chips: real entities for EDC, query-shape hints otherwise
  const exReal = TRACE_EX[IDX.festival];
  const ex = exReal || TRACE_EX._default;
  T.$("#trEx").innerHTML = `<span class="ex-lab">try:</span>` + ex.map(e =>
    exReal ? `<button class="ex-chip" data-q="${T.esc(e)}">${T.esc(e)}</button>`
           : `<span class="ex-chip ghost">${T.esc(e)}</span>`).join("");
  T.$$("#trEx .ex-chip[data-q]").forEach(c => c.onclick = () => { T.$("#trQ").value = c.dataset.q; T.$("#trBtn").click(); });
  T.$("#trBtn").onclick = async () => {
    const ed = T.$("#trEd").value.trim(), q = T.$("#trQ").value.trim();
    if (!ed || !q) { out.innerHTML = `<div class="hint dim">enter an edition and a fact to trace.</div>`; return; }
    out.innerHTML = `<div class="mono dim">tracing…</div>`;
    try { renderTrace(out, await T.postAction("trace_fact", { festival: IDX.festival, edition: ed, query: q })); }
    catch (e) { T.err(out, e.message); }
  };
  T.$("#vfBtn").onclick = async () => {
    const ed = T.$("#trEd").value.trim(), layer = T.$("#vfLay").value;
    if (!ed) { out.innerHTML = `<div class="hint dim">enter an edition to verify.</div>`; return; }
    out.innerHTML = `<div class="mono dim">verifying ${T.esc(layer)}…</div>`;
    try { renderVerify(out, await T.postAction("verify_layer", { festival: IDX.festival, edition: ed, layer })); }
    catch (e) { T.err(out, e.message); }
  };
  T.$("#gtBtn").onclick = async () => {
    const ed = T.$("#trEd").value.trim();
    if (!ed) { out.innerHTML = `<div class="hint dim">enter an edition to quality-check.</div>`; return; }
    out.innerHTML = `<div class="mono dim">running quality gates on ${T.esc(ed)}…</div>`;
    try { renderGate(out, await T.postAction("gate_corpus", { festival: IDX.festival, edition: ed }), ed); }
    catch (e) { T.err(out, e.message); }
  };
  T.$("#trQ").addEventListener("keydown", e => { if (e.key === "Enter") T.$("#trBtn").click(); });
}

function renderTrace(out, d) {
  if (d.error) return T.err(out, d.error);
  const simple = T.isSimple();
  const LNAME = { "10_clean": "readable text", "15_structured": "facts", "20_synthetic": "teaching examples", "25_hydrated": "final training lines" };
  const vpill = { installed: ["pass", "WELL LEARNED"], thin: ["warn", "BARELY THERE"], absent: ["fail", "MISSING"] }[d.verdict] || ["trained", "—"];
  const cards = (d.trace || []).map((t, i) => `
    ${i ? '<span style="align-self:center;color:var(--line-2);font-size:16px">→</span>' : ''}
    <div class="tile" style="flex:1;min-width:120px">
      <div class="k">${simple ? (LNAME[t.layer] || t.layer) : t.layer}</div>
      <div class="v" style="font-size:22px">${T.fmt(t.hits)}<span class="u">${simple ? "×" : "hits"}</span></div>
      <div class="meta">${t.samples.length ? T.esc(t.samples[0].text.slice(0, 60)) + "…" : "not found here"}</div>
    </div>`).join("");
  const verdictMsg = { installed: "The model saw this fact plenty of times — it should know it well.", thin: "The model barely saw this fact — it may not have learned it. Add more about it to your knowledge set.", absent: "This fact never made it into the training data — the model can't know it. Check your sources." }[d.verdict] || "";
  out.innerHTML = `
    <div class="spread mb"><div><span class="mono b">${T.esc(d.query)}</span> <span class="dim">in ${T.esc(d.edition)}</span></div>
      <div class="row gap"><span class="pill ${vpill[0]}"><span class="pd"></span>${vpill[1]}</span>
        <span class="mono dim" style="font-size:11px">${simple ? `taught ${d.exposure} times` : `exposure ${d.exposure} hydrated lines`}</span></div></div>
    <div class="row gap wrap" style="align-items:stretch">${cards}</div>
    <div class="hint dim mt" style="font-size:11.5px;border:0">${T.esc(simple ? verdictMsg : d.note)}</div>`;
}

function renderVerify(out, d) {
  if (d.error) return T.err(out, `${d.error}${d.available ? " · layers: " + d.available.join(", ") : ""}`);
  const simple = T.isSimple();
  const vp = { pass: "pass", warn: "warn", fail: "fail" }[d.verdict] || "trained";
  const vlbl = simple ? { pass: "HEALTHY", warn: "CHECK", fail: "PROBLEM" }[d.verdict] || "—" : d.verdict.toUpperCase();
  out.innerHTML = `
    <div class="spread mb"><div><span class="mono b">${T.esc(d.layer)}</span> <span class="dim">of ${T.esc(d.edition)}</span></div>
      <div class="row gap"><span class="pill ${vp}"><span class="pd"></span>${vlbl}</span>
        <span class="mono dim" style="font-size:11px">${T.fmt(d.total_lines)} lines · ${simple ? `${Math.round((d.distinct_ratio ?? 1) * 100)}% unique` : `distinct ${d.distinct_ratio ?? "—"}`}</span></div></div>
    ${simple ? `<div class="hint dim mb" style="font-size:11.5px;border:0">“Unique” = how many lines are different rather than duplicates. High (90%+) is good — the model sees varied teaching. Low means duplicate-heavy data that teaches less.</div>` : ""}
    <table class="tbl"><thead><tr><th>File</th><th class="num">lines</th><th class="num">${simple ? "unique" : "distinct"}</th><th class="num">${simple ? "% unique" : "ratio"}</th></tr></thead>
      <tbody>${(d.files || []).slice(0, 12).map(f => `<tr><td class="mono" style="font-size:12px">${T.esc(f.file)}</td>
        <td class="num">${T.fmt(f.lines)}</td><td class="num muted">${T.fmt(f.distinct)}</td>
        <td class="num ${f.distinct_ratio != null && f.distinct_ratio < 0.9 ? "q-bad" : "q-good"}">${f.distinct_ratio ?? "—"}</td></tr>`).join("")}</tbody></table>
    <div class="hint dim mt" style="font-size:11.5px;border:0">${T.esc(d.note)}</div>`;
}

// ── quality-gate report (the deterministic recurrence-prevention layer) ──
function renderGate(out, d, ed) {
  if (d.error) return T.err(out, d.error, `Pick an edition that has a hydrated corpus on disk.`);
  const simple = T.isSimple();
  const VP = { pass: "pass", warn: "warn", fail: "fail", skipped: "trained" };
  const VLBL = simple ? { pass: "GOOD", warn: "CHECK", fail: "PROBLEM", skipped: "N/A" }
                      : { pass: "PASS", warn: "WARN", fail: "FAIL", skipped: "SKIP" };
  // plain-language one-liner per gate
  const GNAME = {
    balance: ["Relation balance", "Is the teaching spread across fact types, or dominated by one?"],
    exposure_cap: ["Over-repetition", "Is any single fact repeated so much it crowds out the rest?"],
    id_integrity: ["Fact structure", "Do the structured facts point at the right kind of thing (a stage, not the festival)?"],
    faithfulness: ["Clean text", "Did any 'I can't answer' filler or mixed-up topics leak into the data?"],
    source_vs_gap: ["Missing pieces", "What's absent — and is it because you have no source for it, or a generation slip?"],
  };
  const gates = d.gates || {};
  const rows = Object.entries(gates).map(([k, g]) => {
    const nm = GNAME[k] || [k, ""];
    const ex = (g.examples || []).slice(0, 3);
    return `<div class="panel" style="border-left:3px solid var(--${g.severity === "pass" ? "good" : g.severity === "fail" ? "bad" : "warn"});margin-bottom:8px">
      <div class="spread"><div><span class="b">${nm[0]}</span> ${T.help(nm[1])}</div>
        <span class="pill ${VP[g.severity] || "trained"}"><span class="pd"></span>${VLBL[g.severity] || g.severity}</span></div>
      ${gateMetric(k, g.metrics, simple)}
      ${ex.length ? `<ul class="dlist mt" style="font-size:11.5px">${ex.map(e => `<li><span class="mono">${T.esc(e.text)}</span> — ${T.esc(e.reason)}</li>`).join("")}</ul>` : ""}
    </div>`;
  }).join("");
  // the honest "missing because no data vs missing because bug" split
  const cls = (gates.source_vs_gap || {}).source_gap_vs_defect || {};
  const gapItems = Object.entries(cls);
  const gapPanel = gapItems.length ? `<div class="panel mt" style="background:var(--paper-2)">
    <div class="lab mb">What's missing — and why</div>
    <div class="hint dim mb" style="font-size:11.5px;border:0">A <b>source gap</b> means you have no data for it yet (not a bug — go add sources). A <b>defect</b> means the data exists but generation didn't produce it (a pipeline fix).</div>
    ${gapItems.map(([r, c]) => `<div class="row gap" style="padding:3px 0"><span class="pill ${c.kind === "source_gap" ? "info" : "warn"}" style="text-transform:none"><span class="pd"></span>${c.kind === "source_gap" ? "needs your data" : "generation defect"}</span>
      <span class="mono">${T.esc(r)}</span>${c.needs && c.needs.length ? `<span class="dim mono" style="font-size:11px">needs ${c.needs.map(T.esc).join(", ")}</span>` : ""}</div>`).join("")}</div>` : "";
  out.innerHTML = `
    <div class="spread mb"><div><span class="mono b">quality gates</span> <span class="dim">on ${T.esc(ed)}</span></div>
      <span class="pill ${VP[d.overall] || "trained"}" style="font-size:13px"><span class="pd"></span>${(simple ? VLBL[d.overall] : "OVERALL " + VLBL[d.overall]) || d.overall}</span></div>
    ${rows}${gapPanel}`;
}

function gateMetric(k, m, simple) {
  if (!m) return "";
  const s = v => v == null ? "—" : v;
  let txt = "";
  if (k === "balance") txt = `top type <b>${s(m.dominant)}</b> = ${Math.round((m.dominant_frac || 0) * 100)}% (max ${Math.round((m.dominance_max_frac || 0) * 100)}%) · ${s(m.n_types)} types present`;
  else if (k === "exposure_cap") txt = `typical fact gets <b>${s(m.median)}</b> lines, most ${s(m.max)} (cap ${s(m.cap)}) · ${m.systemic ? "systemic over-repetition" : "within healthy range"}`;
  else if (k === "id_integrity") txt = `<b>${Math.round((m.object_contract_violation_frac || 0) * 100)}%</b> of facts point at the wrong kind of thing · ${s(m.dangling)} broken references`;
  else if (k === "faithfulness") txt = `${s(m.refusals)} filler lines · ${s(m.cooccurrence_violations)} mixed-up-topic lines of ${T.fmt(m.n_lines || 0)}`;
  else if (k === "source_vs_gap") txt = `${s(m.n_source_gap)} missing for lack of data · ${s(m.n_defect)} generation defects`;
  else return "";
  return `<div class="dim mt" style="font-size:12px">${txt}</div>`;
}

function renderBody() {
  const lay = LAYERS.find(l => l[1] === FILTER);
  T.$("#fbar").innerHTML = FILTER === "all"
    ? `showing <b>all editions</b> — expand a city → edition, then its layers`
    : `filtered to layer <b>${lay[2]}</b> <span class="dim">(${lay[0]})</span> — every edition's ${lay[2]} files, newest pipeline stage on the right`;
  T.$("#body").innerHTML = `<div class="split"><div class="tree" id="tree"></div>
    <div class="reader" id="reader"><div class="placeholder">Select a file to read it here.</div></div></div>`;
  const tree = T.$("#tree"), reader = T.$("#reader");
  if (FILTER === "all") return renderEditionTree(tree, reader);
  return renderLayerTree(tree, reader, FILTER);
}

// ── "all editions" mode: city → edition → layers → files ──
function renderEditionTree(tree, reader) {
  const byCity = {};
  IDX.editions.forEach(e => (byCity[e.city] = byCity[e.city] || []).push(e));
  Object.keys(byCity).sort().forEach(city => {
    const cnode = T.el("div", "node", `<span class="tw">▸</span><span class="b">${city.replace(/_/g, " ")}</span><span class="ct">${byCity[city].length}</span>`);
    const kids = T.el("div", "kids"); kids.style.display = "none";
    cnode.onclick = () => { const o = kids.style.display !== "none"; kids.style.display = o ? "none" : "block"; cnode.classList.toggle("open", !o); };
    byCity[city].forEach(e => {
      const enode = T.el("div", "node", `<span class="tw">▸</span>${e.year}<span class="ct">${e.n_docs}d · ${T.fmt(e.n_hydrated)}r</span>`);
      const ekids = T.el("div", "kids"); ekids.style.display = "none"; let loaded = false;
      enode.onclick = async (ev) => {
        ev.stopPropagation();
        const o = ekids.style.display !== "none"; ekids.style.display = o ? "none" : "block"; enode.classList.toggle("open", !o);
        showEdition(reader, e);
        if (!loaded) { loaded = true; await fillEdition(ekids, reader, e.edition); }
      };
      kids.appendChild(enode); kids.appendChild(ekids);
    });
    tree.appendChild(cnode); tree.appendChild(kids);
  });
}

// ── layer-filter mode: edition → that layer's files (cross-corpus) ──
async function renderLayerTree(tree, reader, key) {
  tree.innerHTML = `<div class="node dim">loading ${key}…</div>`;
  let d; try { d = await T.fetchJSON("/api/data/layer/" + key); } catch (e) { tree.innerHTML = `<div class="node q-bad">${T.esc(e.message)}</div>`; return; }
  tree.innerHTML = "";
  if (!d.editions || !d.editions.length) {
    tree.innerHTML = `<div class="node dim">no <b>${T.esc(d.key || key)}</b> files on disk for any edition.</div>`;
    return;
  }
  reader.innerHTML = `<div class="rh"><span>layer · ${T.esc(d.key)}</span><span>${d.n_files} files · ${d.n_editions} editions</span></div>
    <p class="dim mt">${T.esc(d.desc)}. Open any file on the left to read it.</p>`;
  d.editions.forEach(ed => {
    const enode = T.el("div", "node", `<span class="tw">▸</span>${ed.edition}<span class="ct">${ed.n_files}</span>`);
    const ekids = T.el("div", "kids"); ekids.style.display = "none";
    enode.onclick = (ev) => { ev.stopPropagation(); const o = ekids.style.display !== "none"; ekids.style.display = o ? "none" : "block"; enode.classList.toggle("open", !o); };
    ed.files.forEach(f => {
      const meta = f.n != null ? T.fmt(f.n) : (f.bytes / 1024).toFixed(0) + "k";
      const fn = T.el("div", "node", `<span class="tw" style="visibility:hidden">·</span>${T.esc(f.name)}<span class="ct">${meta}</span>`);
      fn.onclick = (ev) => { ev.stopPropagation(); T.$$(".tree .node.sel").forEach(x => x.classList.remove("sel")); fn.classList.add("sel"); openDoc(reader, f.path); };
      ekids.appendChild(fn);
    });
    tree.appendChild(enode); tree.appendChild(ekids);
  });
}

async function fillEdition(box, reader, edition) {
  box.innerHTML = `<div class="node dim">loading…</div>`;
  let d; try { d = await T.fetchJSON("/api/data/" + edition); } catch (e) { box.innerHTML = `<div class="node q-bad">error</div>`; return; }
  box.innerHTML = "";
  const group = (label, hint, items) => {
    if (!items.length) return;
    const gn = T.el("div", "node", `<span class="tw">▸</span><span class="dim" title="${T.esc(hint || '')}">${label}</span><span class="ct">${items.length}</span>`);
    const gk = T.el("div", "kids"); gk.style.display = "none";
    gn.onclick = (ev) => { ev.stopPropagation(); const o = gk.style.display !== "none"; gk.style.display = o ? "none" : "block"; gn.classList.toggle("open", !o); };
    items.forEach(it => {
      const fn = T.el("div", "node", `<span class="tw" style="visibility:hidden">·</span>${T.esc(it.label)}<span class="ct">${it.meta}</span>`);
      fn.onclick = (ev) => { ev.stopPropagation(); T.$$(".tree .node.sel").forEach(x => x.classList.remove("sel")); fn.classList.add("sel"); openDoc(reader, it.path); };
      gk.appendChild(fn);
    });
    box.appendChild(gn); box.appendChild(gk);
  };
  (d.sources || []).forEach(s => group("clean · " + s.source, "readable text from " + s.source,
    s.docs.map(doc => ({ label: doc.name, meta: (doc.bytes / 1024).toFixed(0) + "k", path: doc.path }))));
  (d.layers || []).filter(l => l.layer !== "10_clean").forEach(l =>
    group(l.key, l.desc, (l.files || []).map(f => ({ label: f.name, meta: f.n != null ? T.fmt(f.n) : (f.bytes / 1024).toFixed(0) + "k", path: f.path }))));
}

function showEdition(reader, e) {
  reader.innerHTML = `<div class="rh"><span>${e.edition}</span><span>${e.sources.join(" · ")}</span></div>
    <div class="tiles"><div class="tile"><div class="k">clean docs</div><div class="v">${e.n_docs}</div></div>
      <div class="tile"><div class="k">triples</div><div class="v">${T.fmt(e.n_structured)}</div></div>
      <div class="tile"><div class="k">hydrated relations</div><div class="v">${T.fmt(e.n_hydrated)}</div></div></div>
    <p class="dim mt">Expand the layers in the tree, then open any file to read it here.</p>`;
}

async function openDoc(reader, path) {
  reader.innerHTML = `<div class="placeholder">loading…</div>`;
  let d; try { d = await T.fetchJSON("/api/doc?path=" + encodeURIComponent(path)); } catch (e) { reader.innerHTML = `<div class="errbox">${e.message}</div>`; return; }
  const head = `<div class="rh"><span class="mono">${T.esc(path)}</span><span>${d.kind}${d.n_shown ? " · " + d.n_shown + " rows" : ""}</span></div>`;
  reader.innerHTML = head + (d.kind === "md" ? `<div class="md">${mdLite(d.text)}</div>` : `<pre>${T.esc(d.text)}</pre>`);
  reader.scrollTop = 0;
}

function mdLite(t) {
  return T.esc(t).replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/^- (.*)$/gm, "• $1")
    .replace(/\n{2,}/g, "<br><br>").replace(/\n/g, "<br>");
}
