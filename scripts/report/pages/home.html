<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overview · Torad Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/torad.css">
</head><body>
<script src="/assets/torad.js"></script>
<script>
const slot = T.mountShell({ page: "home" });
slot.innerHTML = `
  <div class="phead">
    <div>
      <h1>Overview</h1>
      <div class="sub">You have a body of knowledge. This console teaches a small AI model to know it, answer what it knows, refuse what it doesn't, and run on a phone. Here's where you are in that journey.</div>
    </div>
    <div class="right"><a class="btn" href="/runs">All runs →</a></div>
  </div>
  <div id="rail"></div>
  <div class="hero simple-only" id="startHero" style="display:none"></div>
  <div id="tiles" class="tiles mb"></div>
  <div class="grid c2">
    <div id="activity"></div>
    <div id="objective"></div>
  </div>
  <div class="panel" id="domainsPanel"><div class="panel-h"><h2>Domains</h2>
    <span class="note">each domain is a body of knowledge, installed into its own on-device model</span></div>
    <div id="domains"></div></div>
  <div class="panel"><div class="panel-h"><h2>Recent runs</h2><a class="note" href="/runs">view all →</a></div>
    <div id="recent"></div></div>`;

function metricCell(v, thr, dir, d = 0) {
  return `<span class="num ${T.grade(v, thr, dir)}">${v == null ? "—" : T.pct(v, d)}</span>`;
}

(async () => {
  let runs, active, inst, objsResp;
  try {
    [runs, active, inst, objsResp] = await Promise.all([
      T.fetchJSON("/api/runs").then(r => r.runs),
      T.fetchJSON("/api/train/active"),
      T.fetchJSON("/api/install"),
      T.fetchJSON("/api/objectives"),
    ]);
  } catch (e) { return T.err(slot, e.message, `Couldn't reach the console server. Start it with <span class="mono">torad serve</span> and reload this page.`); }

  const gated = runs.filter(r => r.metrics);
  const passed = gated.filter(r => r.status === "passed");
  const best = passed.slice().sort((a, b) => (b.metrics.calibration_score || 0) - (a.metrics.calibration_score || 0))[0];
  const latest = runs[runs.length - 1];
  const il = inst.install || {};
  let exported = []; try { exported = (await T.postAction("list_exports", {})).exports || []; } catch (e) {}

  // ── journey progress rail (where am I?) — Prepare → Train → Test → Ship ──
  const steps = [
    { name: "Data ready", done: runs.length > 0 || (inst && inst.install), href: "/data", hint: "Your knowledge is in the training set" },
    { name: "Trained", done: runs.length > 0, href: "/train", hint: runs.length ? `${runs.length} model${runs.length === 1 ? "" : "s"} trained` : "Launch your first run" },
    { name: "Passed the test", done: passed.length > 0, href: best ? "/run?id=" + best.id : "/coach", hint: passed.length ? `${passed.length} passed the quality test` : "No model passes yet — see Coach" },
    { name: "Shipped", done: exported.length > 0, href: "/registry", hint: exported.length ? `${exported.length} exported to on-device` : "Export a passing model" },
  ];
  T.$("#rail").innerHTML = `<div class="journey">${steps.map((s, i) => `${i ? '<span class="jsep"></span>' : ''}
    <a class="jstep ${s.done ? "done" : ""}" href="${s.href}" title="${s.hint}"><span class="jdot">${s.done ? "✓" : i + 1}</span><span class="jlbl">${s.name}</span></a>`).join("")}</div>`;

  // ── "start here" hero for first-timers (simple mode, before any run) ──
  if (T.isSimple() && runs.length === 0) {
    const h = T.$("#startHero"); h.style.display = "";
    h.innerHTML = `<h2>First time? Start here.</h2>
      <p>Two ways in: <b>① Build your knowledge set</b> on the <a href="/data">Your data</a> page (scrape + assemble the facts), or if it's ready, <b>② go straight to <a href="/train">Train</a></b> and launch the Knowledge Phase. After it trains, the <a href="/coach">Coach</a> reads the result in plain language and tells you what to do next.</p>`;
  }

  // ── tiles ──
  T.$("#tiles").innerHTML = [
    `<div class="tile"><div class="k">Models trained</div><div class="v">${runs.length}</div>
       <div class="meta">${passed.length} passed · ${gated.length - passed.length} need work · ${runs.length - gated.length} not tested</div></div>`,
    `<div class="tile accent"><div class="k">Best model</div>
       <div class="v" style="font-size:20px;font-family:var(--serif)">${best ? best.id.replace("edc_sft_", "") : "—"}</div>
       <div class="meta">${best ? T.pill("passed") + " score " + T.fmt(best.metrics.calibration_score, 2) : "none passes the quality test yet"}</div></div>`,
    `<div class="tile"><div class="edge ${il.level === "strong" ? "good" : il.level === "weak" ? "bad" : "warn"}"></div>
       <div class="k">${T.term("install")}</div>
       <div class="v" style="font-size:20px;font-family:var(--serif)">${(il.level || "—").toUpperCase()}</div>
       <div class="meta">${il.ratio ? "knows facts " + il.ratio.toFixed(1) + "× better than guessing" : "—"}${il.fails && il.fails.length ? " · check: " + il.fails.join(", ") : ""}</div></div>`,
  ].join("");

  // ── current activity ──
  const act = T.$("#activity"); act.className = "panel";
  if (active.active) {
    act.innerHTML = `<div class="panel-h"><h2>Training now</h2>${T.pill("running")}</div>
      <div class="spread mb"><div class="mono b" style="font-size:15px">${T.esc(active.run)}</div>
        <div class="mono dim">step ${active.step ?? "—"}/${active.total_steps ?? "—"} · loss ${active.loss != null ? active.loss.toFixed(4) : "—"}</div></div>
      <canvas id="miniloss" style="height:120px;width:100%"></canvas>
      <div class="mt"><a class="btn primary" href="/train">Open live view →</a></div>`;
    requestAnimationFrame(() => T.drawLoss(T.$("#miniloss"), active.points || [], { total: active.total_steps }));
  } else {
    act.innerHTML = `<div class="panel-h"><h2>Current activity</h2><span class="pill trained"><span class="pd"></span>IDLE</span></div>
      <p class="dim" style="margin:.2em 0 1em">No run is training right now. The console reflects what's on disk; start a run and the live view streams its steps and loss here.</p>
      <div class="spread" style="border-top:1px solid var(--line);padding-top:14px">
        <div><div class="lab">Last run</div><div class="mono b mt" style="font-size:15px">${latest ? T.esc(latest.id) + " &nbsp;" + T.pill(latest.status) : "—"}</div>
          <div class="dim mono" style="font-size:11px;margin-top:4px">${latest ? T.relDate(latest.date) : ""}</div></div>
        <a class="btn" href="/train">Open Train →</a></div>`;
  }

  // ── objective card ──
  const obj = T.$("#objective"); obj.className = "panel";
  obj.innerHTML = `<div class="panel-h"><h2>${T.esc(inst.objective ? inst.objective.name : "Your objective")}</h2><span class="lab">objective</span></div>
    <p class="dim" style="margin:.1em 0 .9em">The ${T.term("cpt")} teaches the facts; the ${T.term("sft")} teaches it when to answer. A model is ready when it passes the ${T.term("gate")} <span class="b">and</span> the knowledge is really in its weights.</p>
    <div class="row gap mb" style="flex-wrap:wrap">
      <span class="pill ${best ? "pass" : "fail"}"><span class="pd"></span>${best ? "PASSES QUALITY TEST" : "NOT PASSING YET"}</span>
      ${T.installPill(il.level)}
      <span class="pill info"><span class="pd"></span>${runs.length} MODELS</span>
    </div>
    <div class="lab mb">Overall score across models <span class="dim">(to pass, all three must clear: ${T.word("fabrication")} ≤ ${T.pct(T.GATE.fabrication)}, ${T.word("accuracy")} ≥ ${T.pct(T.GATE.accuracy)}, ${T.word("coverage")} ≥ ${T.pct(T.GATE.coverage)})</span></div>
    <canvas id="caltrend" style="height:96px;width:100%"></canvas>`;
  requestAnimationFrame(() => drawCalTrend(T.$("#caltrend"), gated));

  // ── domains gallery — start-from cards (the worked example to clone + a path to your own) ──
  const objectives = (objsResp && objsResp.objectives) || [];
  const selected = (objsResp && objsResp.selected) || T.objective();
  const cards = objectives.map(o => {
    const cur = o.id === selected, ready = o.has_data && o.n_runs > 0;
    const status = cur ? ["current", "you're here"] : o.status === "active" ? ["active", "in progress"]
      : ready ? ["active", "ready"] : ["planned", "not started"];
    const go = o.has_data ? "/train" : "/data";
    return `<button class="domain-card ${status[0]}" data-id="${T.esc(o.id)}" data-go="${go}">
      <div class="dc-top"><span class="pill ${status[0] === "current" ? "info" : status[0] === "active" ? "pass" : "trained"}"><span class="pd"></span>${status[1]}</span>
        <span class="dc-runs">${o.n_runs} model${o.n_runs === 1 ? "" : "s"}</span></div>
      <div class="dc-name">${T.esc(o.name)}</div>
      <div class="dc-goal">${T.esc(o.goal)}</div>
      <div class="dc-foot">${o.has_data ? `<span class="dc-ok">✓ data ready</span> · ${ready ? "open Train" : "start training"} →`
        : `<span class="dc-no">○ no corpus yet</span> · assemble data →`}</div></button>`;
  }).join("");
  const newCard = `<a class="domain-card domain-new" href="/docs">
    <div class="dc-plus">+</div><div class="dc-name">Start a new domain</div>
    <div class="dc-goal">Pick your own body of knowledge — a game's lore, a product manual, a legal corpus. EDC is the worked example to copy.</div>
    <div class="dc-foot">how to add one →</div></a>`;
  T.$("#domains").innerHTML = `<div class="domain-grid">${cards}${newCard}</div>`;
  T.$$("#domains .domain-card[data-id]").forEach(c => c.onclick = () => {
    T.setObjective(c.dataset.id); location.href = c.dataset.go;
  });

  // ── recent runs table ──
  const recent = runs.slice(-5).reverse();
  T.$("#recent").innerHTML = `<table class="tbl"><thead><tr>
      <th>Model</th><th>Status</th><th class="num">${T.word("fabrication")}</th><th class="num">${T.word("accuracy")}</th><th class="num">${T.word("coverage")}</th><th class="num">When</th></tr></thead>
    <tbody>${recent.map(r => `<tr class="clk" onclick="location='/run?id=${r.id}'">
      <td class="name"><span class="id">${r.id.replace("edc_sft_", "")}</span> <span class="muted">${r.levers_on && r.levers_on.length ? "· " + r.levers_on.length + " levers" : ""}</span></td>
      <td>${T.pill(r.status)}</td>
      <td>${r.metrics ? metricCell(r.metrics.fabrication_rate, T.GATE.fabrication, "max") : '<span class="num dim">—</span>'}</td>
      <td>${r.metrics ? metricCell(r.metrics.accuracy_when_answering, T.GATE.accuracy, "min") : '<span class="num dim">—</span>'}</td>
      <td>${r.metrics ? metricCell(r.metrics.coverage, T.GATE.coverage, "min") : '<span class="num dim">—</span>'}</td>
      <td class="num muted">${T.relDate(r.date)}</td></tr>`).join("")}</tbody></table>`;
})();

function drawCalTrend(cv, runs) {
  if (!cv || !runs.length) return;
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const css = getComputedStyle(document.body), ox = css.getPropertyValue("--ox").trim(),
    good = css.getPropertyValue("--good").trim(), bad = css.getPropertyValue("--bad").trim(),
    line = css.getPropertyValue("--line-2").trim(), ink3 = css.getPropertyValue("--ink-3").trim();
  const padB = 18, padT = 8, n = runs.length, bw = (W - 8) / n, max = 0.7;
  g.font = "10px 'IBM Plex Mono'";
  runs.forEach((r, i) => {
    const v = r.metrics.calibration_score || 0, h = (v / max) * (H - padB - padT);
    const x = 4 + i * bw, y = H - padB - h;
    g.fillStyle = r.status === "passed" ? good : bad; g.globalAlpha = .85;
    g.fillRect(x + 2, y, bw - 6, h); g.globalAlpha = 1;
    g.fillStyle = ink3; g.fillText(r.id.replace("edc_sft_", ""), x + 2, H - 5);
  });
}
</script>
</body></html>
