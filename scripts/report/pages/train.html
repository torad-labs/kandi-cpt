<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Train · Torad Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/torad.css">
</head><body>
<script src="/assets/torad.js"></script>
<script>
const slot = T.mountShell({ page: "train", crumbs: [{ label: "Console", href: "/" }, { label: "Train" }] });
slot.innerHTML = `
  <div class="phead"><div><h1>Train</h1>
    <div class="sub">Pick a phase, click Launch, and watch the model learn — progress streams in live. Only one training job runs at a time, so a launch waits if the GPU is busy.</div></div>
    <div class="right" id="hd"></div></div>
  <div class="hero simple-only" style="padding:18px 22px">
    <h2 style="font-size:18px">Two phases, in order</h2>
    <p><b>1 · ${T.term("cpt")}</b> teaches the model the <b>facts</b> from your knowledge base. It runs first and takes longer.
       <br><b>2 · ${T.term("sft")}</b> then teaches it <b>when to answer vs say “I don't know”</b> — quick, and it runs on top of the Knowledge Phase.
       <br><span class="dim">First time? Start with the Knowledge Phase.</span></p>
  </div>
  <div class="panel" id="launcher">
    <div class="panel-h"><h2>Launch a run</h2><span class="note" id="gpuchip">checking GPU…</span></div>
    <div class="formrow">
      <div class="field"><div class="lab">Phase</div>
        <div class="tg" id="modetg"><button class="on" data-m="cpt" title="Teach the model facts">${T.word("cpt")}</button><button data-m="sft" title="Teach it when to answer">${T.word("sft")}</button></div></div>
      <div class="field grow"><div class="lab">Recipe ${T.help("Points to the training recipe (a config file). The default is set up for you — leave it as-is unless you're tuning.")}</div>
        <input id="cfg" class="inp" value="configs/train_edc_lv_2026.yaml"></div>
      <div class="field hidden" id="labelwrap"><div class="lab">Label ${T.help("A short name for this run, e.g. v12.")}</div>
        <input id="lbl" class="inp" placeholder="v12" style="width:96px"></div>
      <button class="btn primary" id="launchbtn">Launch →</button>
    </div>
    <div id="launchmsg" class="hidden mt"></div>
  </div>
  <div id="status"></div>
  <div class="grid c2">
    <div class="panel"><div class="panel-h"><h2>Loss</h2><span class="note" id="lossnote"></span></div>
      <canvas id="loss" style="width:100%;height:260px"></canvas></div>
    <div class="panel"><div class="panel-h"><h2>Throughput</h2></div><div id="tput"></div></div>
  </div>
  <div class="panel"><div class="panel-h"><h2>Log</h2><span class="note" id="lognote"></span></div>
    <div class="console" id="console"></div></div>`;

let curRun = null, cursor = 0, points = [];
const consoleEl = T.$("#console");

// ── launcher: mode toggle, GPU-busy chip, Launch → POST launch_run (refusal shown verbatim) ──
const CFG_DEFAULT = { cpt: "configs/train_edc_lv_2026.yaml", sft: "configs/sft_edc.yaml" };
let launchMode = "cpt";
T.$("#modetg").querySelectorAll("button").forEach(b => b.onclick = () => {
  T.$("#modetg").querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
  launchMode = b.dataset.m;
  T.$("#cfg").value = CFG_DEFAULT[launchMode];
  T.$("#labelwrap").classList.toggle("hidden", launchMode !== "sft");
});
async function gpuChip() {
  try {
    const g = await T.postAction("gpu_status", {});
    const c = T.$("#gpuchip"), btn = T.$("#launchbtn");
    const simple = T.isSimple();
    if (g.free) { c.textContent = simple ? "Ready to train" : "GPU0 free"; c.style.color = "var(--good)"; btn.disabled = false; }
    else { const h = g.holder;
      c.textContent = simple
        ? (h ? `Busy — training ${h.run_id} (wait or stop it)` : "GPU busy with another program")
        : (h ? `GPU0 busy · ${h.run_id} (step ${h.step ?? "?"})` : `GPU0 busy · foreign pid ${g.foreign_pids}`);
      c.style.color = "var(--bad)"; btn.disabled = false; }
  } catch (e) { /* leave chip */ }
}
T.$("#launchbtn").onclick = async () => {
  const msg = T.$("#launchmsg"), btn = T.$("#launchbtn");
  const args = { mode: launchMode, config: T.$("#cfg").value.trim() };
  if (launchMode === "sft" && T.$("#lbl").value.trim()) args.label = T.$("#lbl").value.trim();
  btn.disabled = true; msg.classList.remove("hidden"); msg.innerHTML = `<span class="mono dim">launching…</span>`;
  try {
    const r = await T.postAction("launch_run", args);
    msg.innerHTML = `<div class="pill pass" style="text-transform:none"><span class="pd"></span>launched ${T.esc(r.run_id)} (pid ${r.pid})</div> <span class="dim mono" style="font-size:12px">streaming below…</span>`;
    curRun = r.run_id; cursor = 0; consoleEl.innerHTML = ""; points = [];
    refresh();
  } catch (e) {
    const recover = e.kind === "gpu_busy"
      ? `Only one model can train at a time (single GPU). It'll free up when the current run finishes — watch it on <a href="/runs">Runs</a>.` : "";
    msg.innerHTML = `<div class="errbox">${e.kind === "gpu_busy" ? "⛔ " : "⚠ "}${T.esc(e.message)}${recover ? `<div class="err-recover">${recover}</div>` : ""}</div>`;
  } finally { btn.disabled = false; gpuChip(); }
};
gpuChip(); T.poll(gpuChip, 4000);

function fmtLine(ln) {
  if (/ step \d+\//.test(ln)) return `<span class="step">${T.esc(ln)}</span>`;
  if (/^W\d|UserWarning|deprecated/i.test(ln)) return `<span class="warn">${T.esc(ln)}</span>`;
  if (/CONTRACT|int8_master|done \d+ steps|save/i.test(ln)) return `<span class="ox">${T.esc(ln)}</span>`;
  return T.esc(ln);
}

async function refresh() {
  const a = await T.fetchJSON("/api/train/active").catch(() => ({ active: false }));
  let runId = a.run, status = a.status, live = a.active;
  if (!runId) {  // idle → tail the latest run
    const runs = await T.fetchJSON("/api/runs").then(r => r.runs).catch(() => []);
    if (runs.length) { runId = runs[runs.length - 1].id; status = "idle"; live = false; }
  }
  if (!runId) { T.$("#status").innerHTML = `<div class="empty">No models yet. Pick a phase above and click <b>Launch</b> — progress will stream here.</div>`; return; }
  if (runId !== curRun) { curRun = runId; cursor = 0; consoleEl.innerHTML = ""; points = []; }

  const log = await T.fetchJSON(`/api/runs/${runId}/log?after=${cursor}`).catch(() => null);
  if (log) {
    if (log.lines.length) {
      consoleEl.insertAdjacentHTML("beforeend", log.lines.map(fmtLine).join("\n") + "\n");
      const atBottom = consoleEl.scrollHeight - consoleEl.scrollTop - consoleEl.clientHeight < 60;
      if (atBottom) consoleEl.scrollTop = consoleEl.scrollHeight;
    }
    cursor = log.next;
    points = log.points || points;
    T.$("#lognote").textContent = (log.path || "") + " · " + log.total + " lines";
  }

  // status header
  const last = points[points.length - 1];
  const total = a.total_steps || (last && last.total) || 450;
  const step = a.step || (last && last.step) || 0;
  const phase = a.phase || "";
  const building = live && step === 0 && /build|prepar|data|gat/i.test(phase);   // non-training phase: no step counter yet
  const gpu = a.gpu, elapsed = fmtEl(a.elapsed_s);
  const hb = gpu ? `GPU ${gpu.util}% · ${gpu.mem_gb}GB · ${elapsed} elapsed` : (elapsed ? elapsed + " elapsed" : "");
  const pillSt = live ? "running" : (status === "stopped" ? "stopped" : "trained");
  const pillLbl = live ? (phase ? phase.toUpperCase() : "TRAINING") : status === "stopped" ? "STOPPED" : "IDLE — last run";
  T.$("#hd").innerHTML = T.pill(pillSt, pillLbl) + (live ? ` <button class="btn" id="stopbtn" style="margin-left:8px">Stop</button>` : "");
  if (live) { const sb = T.$("#stopbtn"); if (sb) sb.onclick = async () => {
    sb.disabled = true; sb.textContent = "stopping…";
    try { await T.postAction("stop_run", { run_id: curRun }); } catch (e) { sb.textContent = "Stop"; sb.disabled = false; }
  }; }
  T.$("#status").className = "panel";
  T.$("#status").innerHTML = `
    <div class="spread mb"><div class="mono b" style="font-size:16px">${T.esc(runId)}</div>
      <div class="mono dim">${live ? (phase || "live") : status === "stopped" ? "process ended" : "not currently training"}</div></div>
    ${building
      ? `<div class="mono dim" style="font-size:12.5px">${T.isSimple()
          ? "Assembling the training data right now (2–5 min — normal). The log stays quiet during this step; the live dot below shows it's working. Learning steps start streaming once it's done."
          : "This step scores which facts the model already knows, in batches — it doesn't print per-item, so the log stays quiet. The heartbeat below shows it's working; training steps stream once it finishes."}</div>
         <div class="spread mono mt" style="font-size:12.5px"><span class="b" style="color:var(--ox)">${hb || "working…"}</span><span class="dim">${T.esc(phase)}</span></div>
         <div class="mbar mt" style="height:8px;overflow:hidden"><i class="ox" style="width:100%;opacity:.3;animation:pulse 1.4s ease-in-out infinite"></i></div>`
      : `${T.isSimple() && live ? `<div class="b mb" style="font-size:13.5px;color:var(--ox)">Learning · step ${step} of ${total}${last && last.sps ? ` · about ${Math.max(1, Math.ceil((total - step) * last.sps / 60))} min left` : ""}</div>` : ""}
         <div class="spread mono" style="font-size:12.5px"><span>step ${step} / ${total}</span><span>${hb ? hb + " · " : ""}${((step / total) * 100).toFixed(0)}%</span></div>
         <div class="mbar mt" style="height:8px"><i class="ox" style="width:${Math.min(100, step / total * 100)}%"></i></div>`}
    <div class="tiles mt">
      <div class="tile"><div class="k">loss</div><div class="v">${last ? last.loss.toFixed(4) : "—"}</div></div>
      <div class="tile"><div class="k">lr</div><div class="v" style="font-size:18px">${last ? last.lr.toExponential(1) : "—"}</div></div>
      <div class="tile"><div class="k">peak mem</div><div class="v">${last ? last.mem.toFixed(1) : "—"}<span class="u">GB</span></div></div>
      <div class="tile"><div class="k">speed</div><div class="v">${last ? last.sps.toFixed(2) : "—"}<span class="u">s/step</span></div></div>
    </div>`;
  T.$("#lossnote").textContent = points.length ? `${points.length} logged steps` : "";
  T.drawLoss(T.$("#loss"), points, { total });
  // throughput sparkline (s/step over time)
  drawTput(points);
}

function drawTput(pts) {
  const box = T.$("#tput");
  if (!pts.length) { box.innerHTML = `<div class="empty" style="padding:30px">no steps yet</div>`; return; }
  const last = pts[pts.length - 1], eta = last.total > last.step ? ((last.total - last.step) * last.sps) : 0;
  box.innerHTML = `
    <div class="tiles mb"><div class="tile"><div class="k">avg s/step</div><div class="v">${last.sps.toFixed(2)}</div></div>
      <div class="tile accent"><div class="k">ETA</div><div class="v" style="font-size:20px">${eta ? Math.ceil(eta / 60) + " min" : "done"}</div><div class="meta">${last.total - last.step} steps left</div></div></div>
    <canvas id="sps" style="width:100%;height:120px"></canvas>`;
  requestAnimationFrame(() => {
    const cv = T.$("#sps"), dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
    const css = getComputedStyle(document.body), info = css.getPropertyValue("--info").trim();
    const max = Math.max(...pts.map(p => p.sps)) * 1.1, min = Math.min(...pts.map(p => p.sps)) * .9;
    g.strokeStyle = info; g.lineWidth = 1.6; g.beginPath();
    pts.forEach((p, i) => { const x = (i / (pts.length - 1)) * W, y = H - ((p.sps - min) / (max - min)) * (H - 10) - 5; i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  });
}

function fmtEl(s) {
  if (s == null) return "";
  s = Math.floor(s);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), ss = s % 60;
  if (m < 60) return m + "m " + (ss < 10 ? "0" : "") + ss + "s";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}

T.poll(refresh, 2000);
</script>
</body></html>
