<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runs · Torad Train</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/torad.css">
</head><body>
<script src="/assets/torad.js"></script>
<script>
const slot = T.mountShell({ page: "runs", crumbs: [{ label: "Console", href: "/" }, { label: "Runs" }] });
slot.innerHTML = `
  <div class="phead"><div><h1>Runs</h1>
    <div class="sub">Every SFT run under <span class="mono">checkpoints/sft/</span>, read live from its run contract + the calibration ledger. A run PASSES the behaviour gate only when all three thresholds hold at once.</div></div></div>
  <div class="panel"><div class="panel-h"><h2>EDC Corpus Install — SFT campaign</h2>
    <span class="note">gate · fab ≤ ${T.pct(T.GATE.fabrication)} &nbsp; acc ≥ ${T.pct(T.GATE.accuracy)} &nbsp; cov ≥ ${T.pct(T.GATE.coverage)}</span></div>
    <div id="tbl"></div></div>`;

function cell(v, thr, dir) {
  if (v == null) return `<td class="num dim">—</td>`;
  return `<td class="num"><div class="spread gap"><span class="${T.grade(v, thr, dir)}">${T.pct(v)}</span>
    <span style="width:54px">${T.miniBar(v, 1, thr, T.grade(v, thr, dir) === "q-good" ? "good" : "bad")}</span></div></td>`;
}

(async () => {
  let runs; try { runs = (await T.fetchJSON("/api/runs")).runs; } catch (e) { return T.err(slot, e.message); }
  runs = runs.slice().reverse();
  T.$("#tbl").innerHTML = `<table class="tbl"><thead><tr>
      <th>Run</th><th>Status</th><th>Install</th>
      <th class="num">Fabrication</th><th class="num">Accuracy</th><th class="num">Coverage</th>
      <th class="num">Calib</th><th class="num">Steps</th><th class="num">When</th></tr></thead>
    <tbody>${runs.map(r => {
      const m = r.metrics;
      return `<tr class="clk" onclick="location='/run?id=${r.id}'">
        <td class="name"><span class="id">${r.id.replace("edc_sft_", "")}</span>
          ${r.levers_on && r.levers_on.length ? `<span class="muted mono" style="font-size:10px"> ${r.levers_on.join(" ")}</span>` : ""}</td>
        <td>${T.pill(r.status)}</td>
        <td>${r.gate ? gateChips(r.gate) : '<span class="dim mono" style="font-size:10px">—</span>'}</td>
        ${cell(m && m.fabrication_rate, T.GATE.fabrication, "max")}
        ${cell(m && m.accuracy_when_answering, T.GATE.accuracy, "min")}
        ${cell(m && m.coverage, T.GATE.coverage, "min")}
        <td class="num">${m ? T.fmt(m.calibration_score, 2) : "—"}</td>
        <td class="num muted">${r.max_steps || "—"}</td>
        <td class="num muted">${T.relDate(r.date)}</td></tr>`;
    }).join("")}</tbody></table>`;
})();

function gateChips(g) {
  const m = [["fab", g.fabrication_ok], ["acc", g.accuracy_ok], ["cov", g.coverage_ok]];
  return `<span class="row" style="gap:4px">${m.map(([k, ok]) =>
    `<span class="mono" style="font-size:10px;padding:1px 5px;border-radius:4px;background:${ok ? "var(--good-wash)" : "var(--bad-wash)"};color:${ok ? "var(--good)" : "var(--bad)"}">${k}</span>`).join("")}</span>`;
}
</script>
</body></html>
